name: Deploy Production

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  GCP_REGION: us-central1
  GAR_REPOSITORY: quadsmith-docker

jobs:
  build-and-push:
    name: Build & Push Images (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service:
          - server-web
          - server-api
          - server-ops
          - server-jobs
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: "src/go/go.work.sum"

      - name: Sync Go Vendor Dependencies
        run: cd src/go && go work vendor

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/go/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ matrix.service }}:latest
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ matrix.service }}:sha-${{ github.sha }}

  deploy-vm:
    name: Roll Out to e2-micro VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Sync Compose & Nginx Manifests and Restart Services via IAP Tunnel
        run: |
          gcloud compute scp --tunnel-through-iap --recurse \
            src/deploy/docker-compose.prod.yaml \
            src/deploy/nginx \
            "${{ secrets.GCP_VM_NAME }}:/opt/quadsmith/src/deploy/" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --zone="${{ secrets.GCP_VM_ZONE }}"

          gcloud compute ssh "${{ secrets.GCP_VM_NAME }}" \
            --tunnel-through-iap \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --zone="${{ secrets.GCP_VM_ZONE }}" \
            --command="cd /opt/quadsmith && COMPOSE_PROFILES=primary docker compose -f src/deploy/docker-compose.prod.yaml pull && COMPOSE_PROFILES=primary docker compose -f src/deploy/docker-compose.prod.yaml up -d --remove-orphans"
