name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment (staging or prod)"
        required: true
        default: "prod"
        type: choice
        options:
          - staging
          - prod
      ref:
        description: "Git commit SHA, tag, or branch to deploy (defaults to selected branch/tag HEAD)"
        required: false
        default: ""
        type: string
      allow_breaking_changes:
        description: "Approve and apply breaking SQL/API/seed schema changes"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: deploy-${{ (github.event_name == 'workflow_dispatch' && inputs.environment) || (github.ref == 'refs/heads/main' && 'staging') || 'prod' }}
  cancel-in-progress: false

env:
  GCP_REGION: us-central1
  GAR_REPOSITORY: quadsmith-docker
  TARGET_ENV: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment) || (github.ref == 'refs/heads/main' && 'staging') || 'prod' }}
  ENV_PREFIX: ${{ ((github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') || (github.event_name != 'workflow_dispatch' && github.ref == 'refs/heads/main')) && 'STAGING' || 'PROD' }}

jobs:
  check-credentials:
    name: Validate Secrets & Resolve Ref (${{ (github.event_name == 'workflow_dispatch' && inputs.environment) || (github.ref == 'refs/heads/main' && 'staging') || 'prod' }})
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.ref.outputs.deploy_sha }}
      previous_sha: ${{ steps.ref.outputs.previous_sha }}
    steps:
      - name: Validate all required ${{ env.ENV_PREFIX }}_* Repository Secrets are non-empty
        env:
          GCP_SA_KEY: ${{ secrets[format('{0}_GCP_SA_KEY', env.ENV_PREFIX)] }}
          CF_ACCOUNT_ID: ${{ secrets[format('{0}_CF_ACCOUNT_ID', env.ENV_PREFIX)] }}
          CF_ZONE_ID: ${{ secrets[format('{0}_CF_ZONE_ID', env.ENV_PREFIX)] }}
          CF_API_TOKEN: ${{ secrets[format('{0}_CF_API_TOKEN', env.ENV_PREFIX)] }}
          QS_DB_PASSWORD: ${{ secrets[format('{0}_QS_DB_PASSWORD', env.ENV_PREFIX)] }}
          QS_AUTH_SECRET: ${{ secrets[format('{0}_QS_AUTH_SECRET', env.ENV_PREFIX)] }}
          QS_JOB_SERVER_AUTH_TOKEN: ${{ secrets[format('{0}_QS_JOB_SERVER_AUTH_TOKEN', env.ENV_PREFIX)] }}
          QS_SMTP_PASSWORD: ${{ secrets[format('{0}_QS_SMTP_PASSWORD', env.ENV_PREFIX)] }}
          QS_GOOGLE_CLIENT_ID: ${{ secrets[format('{0}_QS_GOOGLE_CLIENT_ID', env.ENV_PREFIX)] }}
          QS_GOOGLE_CLIENT_SECRET: ${{ secrets[format('{0}_QS_GOOGLE_CLIENT_SECRET', env.ENV_PREFIX)] }}
          QS_GITHUB_CLIENT_ID: ${{ secrets[format('{0}_QS_GITHUB_CLIENT_ID', env.ENV_PREFIX)] }}
          QS_GITHUB_CLIENT_SECRET: ${{ secrets[format('{0}_QS_GITHUB_CLIENT_SECRET', env.ENV_PREFIX)] }}
          QS_DISCORD_CLIENT_ID: ${{ secrets[format('{0}_QS_DISCORD_CLIENT_ID', env.ENV_PREFIX)] }}
          QS_DISCORD_CLIENT_SECRET: ${{ secrets[format('{0}_QS_DISCORD_CLIENT_SECRET', env.ENV_PREFIX)] }}
          QS_OAUTH_CLIENT_ID: ${{ secrets[format('{0}_QS_OAUTH_CLIENT_ID', env.ENV_PREFIX)] }}
          QS_OAUTH_CLIENT_SECRET: ${{ secrets[format('{0}_QS_OAUTH_CLIENT_SECRET', env.ENV_PREFIX)] }}
        run: |
          REQUIRED_VARS=(
            GCP_SA_KEY
            CF_ACCOUNT_ID
            CF_ZONE_ID
            CF_API_TOKEN
            QS_DB_PASSWORD
            QS_AUTH_SECRET
            QS_JOB_SERVER_AUTH_TOKEN
            QS_SMTP_PASSWORD
            QS_GOOGLE_CLIENT_ID
            QS_GOOGLE_CLIENT_SECRET
            QS_GITHUB_CLIENT_ID
            QS_GITHUB_CLIENT_SECRET
            QS_DISCORD_CLIENT_ID
            QS_DISCORD_CLIENT_SECRET
            QS_OAUTH_CLIENT_ID
            QS_OAUTH_CLIENT_SECRET
          )
          MISSING=0
          for var in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Required repository secret ${ENV_PREFIX}_${var} is not set or is empty."
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi
          echo "All 16 ${ENV_PREFIX}_* repository secrets are set and non-empty."

      - name: Check out target git ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Resolve canonical commit SHA and current '${{ env.TARGET_ENV }}' tag
        id: ref
        run: |
          git fetch origin --tags --force
          DEPLOY_SHA="$(git rev-parse HEAD)"
          PREVIOUS_SHA="$(git rev-parse "refs/tags/${TARGET_ENV}^{commit}" 2>/dev/null || true)"
          echo "Resolved deployment commit SHA: ${DEPLOY_SHA} (target environment: ${TARGET_ENV})"
          if [ -n "${PREVIOUS_SHA}" ]; then
            echo "Current '${TARGET_ENV}' tag points to last known good commit: ${PREVIOUS_SHA}"
          else
            echo "No existing '${TARGET_ENV}' tag found (initial deployment to ${TARGET_ENV})."
          fi
          echo "deploy_sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "previous_sha=${PREVIOUS_SHA}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push Images (${{ matrix.service }})
    needs: check-credentials
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service:
          - server-web
          - server-api
          - server-ops
          - server-jobs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-credentials.outputs.deploy_sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: "src/go/go.work.sum"

      - name: Sync Go Vendor Dependencies
        run: cd src/go && go work vendor

      - name: Extract GCP Project ID from deploy/config/${{ env.TARGET_ENV }}.textproto
        id: config
        run: |
          PROJECT_ID="$(awk -F'"' '/^[[:space:]]*gcp_project_id:/ {print $2}' "deploy/config/${TARGET_ENV}.textproto")"
          echo "project_id=${PROJECT_ID}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets[format('{0}_GCP_SA_KEY', env.ENV_PREFIX)] }}

      - name: Set up Cloud SDK & Ensure Artifact Registry Exists
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud artifacts repositories describe "${{ env.GAR_REPOSITORY }}" \
            --location="${{ env.GCP_REGION }}" \
            --project="${{ steps.config.outputs.project_id }}" >/dev/null 2>&1 || \
            gcloud artifacts repositories create "${{ env.GAR_REPOSITORY }}" \
              --repository-format=docker \
              --location="${{ env.GCP_REGION }}" \
              --project="${{ steps.config.outputs.project_id }}"
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/go/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ steps.config.outputs.project_id }}/${{ env.GAR_REPOSITORY }}/${{ matrix.service }}:latest
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ steps.config.outputs.project_id }}/${{ env.GAR_REPOSITORY }}/${{ matrix.service }}:sha-${{ needs.check-credentials.outputs.deploy_sha }}

  migrate-db:
    name: Provision Infrastructure & Run Automated DB Migration Gate
    needs:
      - check-credentials
      - build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-credentials.outputs.deploy_sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: "src/go/go.work.sum"

      - name: Sync Go Vendor Dependencies
        run: cd src/go && go work vendor

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets[format('{0}_GCP_SA_KEY', env.ENV_PREFIX)] }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install PostgreSQL Client & psqldef
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client socat jq
          curl -fsSL https://github.com/sqldef/sqldef/releases/latest/download/psqldef_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin psqldef

      - name: Run Provisioning, Breaking-Change Gate, Pre-Migration Backup & Schema Migration
        env:
          CF_ACCOUNT_ID: ${{ secrets[format('{0}_CF_ACCOUNT_ID', env.ENV_PREFIX)] }}
          CF_ZONE_ID: ${{ secrets[format('{0}_CF_ZONE_ID', env.ENV_PREFIX)] }}
          CF_API_TOKEN: ${{ secrets[format('{0}_CF_API_TOKEN', env.ENV_PREFIX)] }}
          QS_DB_PASSWORD: ${{ secrets[format('{0}_QS_DB_PASSWORD', env.ENV_PREFIX)] }}
          QS_AUTH_SECRET: ${{ secrets[format('{0}_QS_AUTH_SECRET', env.ENV_PREFIX)] }}
          QS_JOB_SERVER_AUTH_TOKEN: ${{ secrets[format('{0}_QS_JOB_SERVER_AUTH_TOKEN', env.ENV_PREFIX)] }}
          QS_SMTP_PASSWORD: ${{ secrets[format('{0}_QS_SMTP_PASSWORD', env.ENV_PREFIX)] }}
          QS_GOOGLE_CLIENT_ID: ${{ secrets[format('{0}_QS_GOOGLE_CLIENT_ID', env.ENV_PREFIX)] }}
          QS_GOOGLE_CLIENT_SECRET: ${{ secrets[format('{0}_QS_GOOGLE_CLIENT_SECRET', env.ENV_PREFIX)] }}
          QS_GITHUB_CLIENT_ID: ${{ secrets[format('{0}_QS_GITHUB_CLIENT_ID', env.ENV_PREFIX)] }}
          QS_GITHUB_CLIENT_SECRET: ${{ secrets[format('{0}_QS_GITHUB_CLIENT_SECRET', env.ENV_PREFIX)] }}
          QS_DISCORD_CLIENT_ID: ${{ secrets[format('{0}_QS_DISCORD_CLIENT_ID', env.ENV_PREFIX)] }}
          QS_DISCORD_CLIENT_SECRET: ${{ secrets[format('{0}_QS_DISCORD_CLIENT_SECRET', env.ENV_PREFIX)] }}
          QS_OAUTH_CLIENT_ID: ${{ secrets[format('{0}_QS_OAUTH_CLIENT_ID', env.ENV_PREFIX)] }}
          QS_OAUTH_CLIENT_SECRET: ${{ secrets[format('{0}_QS_OAUTH_CLIENT_SECRET', env.ENV_PREFIX)] }}
        run: |
          make deploy \
            ENV="${{ env.TARGET_ENV }}" \
            STAGE=migrate \
            ALLOW_BREAKING_CHANGES="${{ inputs.allow_breaking_changes || false }}" \
            QS_IMAGE_TAG="sha-${{ needs.check-credentials.outputs.deploy_sha }}"

  deploy-vm:
    name: Zero-Downtime Blue-Green Rollout to Regional VMs
    needs:
      - check-credentials
      - migrate-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-credentials.outputs.deploy_sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: "src/go/go.work.sum"

      - name: Sync Go Vendor Dependencies
        run: cd src/go && go work vendor

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets[format('{0}_GCP_SA_KEY', env.ENV_PREFIX)] }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Roll Out Blue-Green Deployment Across Regional Nodes
        env:
          CF_ACCOUNT_ID: ${{ secrets[format('{0}_CF_ACCOUNT_ID', env.ENV_PREFIX)] }}
          CF_ZONE_ID: ${{ secrets[format('{0}_CF_ZONE_ID', env.ENV_PREFIX)] }}
          CF_API_TOKEN: ${{ secrets[format('{0}_CF_API_TOKEN', env.ENV_PREFIX)] }}
          QS_DB_PASSWORD: ${{ secrets[format('{0}_QS_DB_PASSWORD', env.ENV_PREFIX)] }}
          QS_AUTH_SECRET: ${{ secrets[format('{0}_QS_AUTH_SECRET', env.ENV_PREFIX)] }}
          QS_JOB_SERVER_AUTH_TOKEN: ${{ secrets[format('{0}_QS_JOB_SERVER_AUTH_TOKEN', env.ENV_PREFIX)] }}
          QS_SMTP_PASSWORD: ${{ secrets[format('{0}_QS_SMTP_PASSWORD', env.ENV_PREFIX)] }}
          QS_GOOGLE_CLIENT_ID: ${{ secrets[format('{0}_QS_GOOGLE_CLIENT_ID', env.ENV_PREFIX)] }}
          QS_GOOGLE_CLIENT_SECRET: ${{ secrets[format('{0}_QS_GOOGLE_CLIENT_SECRET', env.ENV_PREFIX)] }}
          QS_GITHUB_CLIENT_ID: ${{ secrets[format('{0}_QS_GITHUB_CLIENT_ID', env.ENV_PREFIX)] }}
          QS_GITHUB_CLIENT_SECRET: ${{ secrets[format('{0}_QS_GITHUB_CLIENT_SECRET', env.ENV_PREFIX)] }}
          QS_DISCORD_CLIENT_ID: ${{ secrets[format('{0}_QS_DISCORD_CLIENT_ID', env.ENV_PREFIX)] }}
          QS_DISCORD_CLIENT_SECRET: ${{ secrets[format('{0}_QS_DISCORD_CLIENT_SECRET', env.ENV_PREFIX)] }}
          QS_OAUTH_CLIENT_ID: ${{ secrets[format('{0}_QS_OAUTH_CLIENT_ID', env.ENV_PREFIX)] }}
          QS_OAUTH_CLIENT_SECRET: ${{ secrets[format('{0}_QS_OAUTH_CLIENT_SECRET', env.ENV_PREFIX)] }}
        run: |
          make deploy \
            ENV="${{ env.TARGET_ENV }}" \
            STAGE=rollout \
            QS_IMAGE_TAG="sha-${{ needs.check-credentials.outputs.deploy_sha }}"

      - name: Tag deployed commit as '${{ env.TARGET_ENV }}'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${TARGET_ENV}" "${{ needs.check-credentials.outputs.deploy_sha }}"
          git push origin "refs/tags/${TARGET_ENV}" --force
          echo "Successfully tagged commit ${{ needs.check-credentials.outputs.deploy_sha }} as '${TARGET_ENV}'."

  rollback:
    name: Roll Back to Latest '${{ (github.event_name == 'workflow_dispatch' && inputs.environment) || (github.ref == 'refs/heads/main' && 'staging') || 'prod' }}' Tag on Failure
    needs:
      - check-credentials
      - build-and-push
      - migrate-db
      - deploy-vm
    if: ${{ failure() && needs.check-credentials.result == 'success' && needs.check-credentials.outputs.previous_sha != '' && (needs.migrate-db.result == 'failure' || needs.deploy-vm.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out last known good '${{ env.TARGET_ENV }}' commit (${{ needs.check-credentials.outputs.previous_sha }})
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-credentials.outputs.previous_sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: "src/go/go.work.sum"

      - name: Sync Go Vendor Dependencies
        run: cd src/go && go work vendor

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets[format('{0}_GCP_SA_KEY', env.ENV_PREFIX)] }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install PostgreSQL Client & psqldef
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client socat jq
          curl -fsSL https://github.com/sqldef/sqldef/releases/latest/download/psqldef_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin psqldef

      - name: Roll back database schema and regional VMs to '${{ env.TARGET_ENV }}' tag (${{ needs.check-credentials.outputs.previous_sha }})
        env:
          CF_ACCOUNT_ID: ${{ secrets[format('{0}_CF_ACCOUNT_ID', env.ENV_PREFIX)] }}
          CF_ZONE_ID: ${{ secrets[format('{0}_CF_ZONE_ID', env.ENV_PREFIX)] }}
          CF_API_TOKEN: ${{ secrets[format('{0}_CF_API_TOKEN', env.ENV_PREFIX)] }}
          QS_DB_PASSWORD: ${{ secrets[format('{0}_QS_DB_PASSWORD', env.ENV_PREFIX)] }}
          QS_AUTH_SECRET: ${{ secrets[format('{0}_QS_AUTH_SECRET', env.ENV_PREFIX)] }}
          QS_JOB_SERVER_AUTH_TOKEN: ${{ secrets[format('{0}_QS_JOB_SERVER_AUTH_TOKEN', env.ENV_PREFIX)] }}
          QS_SMTP_PASSWORD: ${{ secrets[format('{0}_QS_SMTP_PASSWORD', env.ENV_PREFIX)] }}
          QS_GOOGLE_CLIENT_ID: ${{ secrets[format('{0}_QS_GOOGLE_CLIENT_ID', env.ENV_PREFIX)] }}
          QS_GOOGLE_CLIENT_SECRET: ${{ secrets[format('{0}_QS_GOOGLE_CLIENT_SECRET', env.ENV_PREFIX)] }}
          QS_GITHUB_CLIENT_ID: ${{ secrets[format('{0}_QS_GITHUB_CLIENT_ID', env.ENV_PREFIX)] }}
          QS_GITHUB_CLIENT_SECRET: ${{ secrets[format('{0}_QS_GITHUB_CLIENT_SECRET', env.ENV_PREFIX)] }}
          QS_DISCORD_CLIENT_ID: ${{ secrets[format('{0}_QS_DISCORD_CLIENT_ID', env.ENV_PREFIX)] }}
          QS_DISCORD_CLIENT_SECRET: ${{ secrets[format('{0}_QS_DISCORD_CLIENT_SECRET', env.ENV_PREFIX)] }}
          QS_OAUTH_CLIENT_ID: ${{ secrets[format('{0}_QS_OAUTH_CLIENT_ID', env.ENV_PREFIX)] }}
          QS_OAUTH_CLIENT_SECRET: ${{ secrets[format('{0}_QS_OAUTH_CLIENT_SECRET', env.ENV_PREFIX)] }}
        run: |
          echo "::warning::Deployment of ${{ needs.check-credentials.outputs.deploy_sha }} failed; rolling '${TARGET_ENV}' back to commit ${{ needs.check-credentials.outputs.previous_sha }}."
          make deploy \
            ENV="${{ env.TARGET_ENV }}" \
            STAGE=migrate \
            ALLOW_BREAKING_CHANGES=true \
            QS_IMAGE_TAG="sha-${{ needs.check-credentials.outputs.previous_sha }}"
          make deploy \
            ENV="${{ env.TARGET_ENV }}" \
            STAGE=rollout \
            QS_IMAGE_TAG="sha-${{ needs.check-credentials.outputs.previous_sha }}"
