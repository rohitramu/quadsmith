name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install Protoc
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Set up uv
      uses: astral-sh/setup-uv@v3

    - name: Install Web Dependencies
      run: npm ci
      working-directory: ./src/frontend/web

    - name: Verify Code Generation
      run: |
        make generate
        # Ensure that no files were modified by make generate
        git diff --exit-code || (echo "Generated code is out of sync. Please run 'make generate' and commit the changes." && exit 1)

    - name: Verify Code Formatting
      run: |
        # Format Go
        find . -name "*.go" -not -path "*/vendor/*" -exec gofmt -s -w {} +
        
        # Format Protobuf
        cd proto && ../bin/buf format -w && cd ..

        # Format Textproto
        find src -name "*.textproto" -exec ./bin/txtpbfmt -expand_all_children {} +

        # Format TypeScript, HTML, and CSS
        cd src/frontend/web && npx prettier --write "*.html" "*.ts" "src/**/*.{ts,tsx,css,html}" && cd ../../..

        # Format Python (isort + ruff format)
        uvx ruff check --select I --fix tools/
        uvx ruff format tools/
        
        # Format SQL
        npx -y sql-formatter --config .sql-formatter.json --fix src/backend/db/schema.sql
        
        # Ensure that no files were modified by the formatters
        git diff --exit-code || (echo "Code formatting is out of sync. Please ensure you are running formatters on Python, Go, TypeScript, HTML, CSS, Protobuf, and Textproto files." && exit 1)

    - name: Run Tests
      run: make test
