name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify Code & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: "src/go/go.work.sum"

      - name: Sync Go Vendor Dependencies
        run: cd src/go && go work vendor

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install Web Dependencies
        run: npm ci
        working-directory: ./src/react

      - name: Verify Code Generation & Formatting
        run: make verify

  test:
    name: Test (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
        include:
          - shard: 1/2
            shard_id: 1
          - shard: 2/2
            shard_id: 2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: "src/go/go.work.sum"

      - name: Sync Go Vendor Dependencies
        run: cd src/go && go work vendor

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install Web Dependencies
        run: npm ci
        working-directory: ./src/react

      - name: Run Tests (Shard ${{ matrix.shard }})
        run: make test SHARD=${{ matrix.shard }}

      - name: Upload Playwright Failure Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard_id }}
          path: .tmp/playwright-report/
          retention-days: 7
