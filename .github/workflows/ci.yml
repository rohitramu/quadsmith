name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify Code & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.27"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install Web Dependencies
        run: npm install
        working-directory: ./src/react

      - name: Verify Code Generation
        run: |
          make generate
          # Ensure that no files were modified by make generate
          git diff --exit-code || (echo "Generated code is out of sync. Please run 'make generate' and commit the changes." && exit 1)

      - name: Verify Code Formatting
        run: |
          # Format Go
          find . -name "*.go" -not -path "*/vendor/*" -exec gofmt -s -w {} +

          # Format Protobuf
          cd src/proto && ../../bin/buf format -w && cd ../..

          # Format Textproto
          find src test -name "*.textproto" -exec ./bin/txtpbfmt -expand_all_children {} +

          # Format TypeScript, HTML, and CSS
          npx --prefix src/react/app-web prettier --write "src/react/app-web/index.html" "src/react/app-web/src/**/*.{ts,tsx,css,html}" "src/react/shared/src/**/*.{ts,tsx,css,html}"

          # Format and Lint Markdown
          npx --prefix src/react/app-web prettier --ignore-path .prettierignore --write "**/*.md"
          npx --prefix src/react/app-web markdownlint -c .markdownlint.json --ignore-path .markdownlintignore --fix "**/*.md"

          # Format Python (isort + ruff format)
          uvx ruff check --select I --fix tools/
          uvx ruff format tools/

          # Format SQL
          for f in src/db/*.sql; do npx -y sql-formatter --config .sql-formatter.json --fix "$f"; done

          # Ensure that no files were modified by the formatters
          git diff --exit-code || (echo "Code formatting is out of sync. Please ensure you are running formatters on Python, Go, TypeScript, HTML, CSS, Protobuf, Textproto, and Markdown files." && exit 1)

  test:
    name: Test (Shard ${{ matrix.shard }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.27"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install Web Dependencies
        run: npm install
        working-directory: ./src/react

      - name: Run Tests (Shard ${{ matrix.shard }})
        run: make ci-test SHARD=${{ matrix.shard }}

      - name: Upload Playwright Failure Report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report-shard-${{ strategy.job-index }}
          path: .tmp/playwright-report/
          retention-days: 7
