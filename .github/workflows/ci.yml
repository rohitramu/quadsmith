name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Install Protoc
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Check out vendored modules
      run: go mod vendor
      working-directory: ./backend/api

    - name: Run Tests
      run: cd backend/api && go test ./...

    - name: Verify Code Generation
      run: |
        make generate
        # Ensure that no files were modified by make generate
        git diff --exit-code || (echo "Generated code is out of sync. Please run 'make generate' and commit the changes." && exit 1)
