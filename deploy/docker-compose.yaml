services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_PORT:-9000}:9000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstreams.conf:/etc/nginx/conf.d/upstreams.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      ops-api:
        condition: service_healthy
      ops-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9000/healthz || exit 1"]
      interval: 200ms
      timeout: 2s
      retries: 100
      start_period: 15s

  api:
    image: ${QS_IMAGE_REGISTRY:-quadsmith}/server-api:${QS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: src/go/server-api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - QS_ENV=${QS_ENV:-sandbox}
      - QS_REGION=${QS_REGION:-local}
      - QS_CONFIG=/app/src/go/server-api/config/${QS_ENV:-sandbox}.textproto
      - QS_DATABASE_URL=${QS_DATABASE_URL:-postgres://postgres:postgres@host.docker.internal:${DB_PORT:-5432}/quadsmith_api?sslmode=disable}
      - QS_READ_DATABASE_URL=${QS_READ_DATABASE_URL:-}
      - QS_PEER_DATABASE_URLS=${QS_PEER_DATABASE_URLS:-}
      - QS_WEB_BASE_URL=${QS_WEB_BASE_URL:-http://localhost:${PORT:-8080}}
      - QS_AUTH_SECRET=${QS_AUTH_SECRET:-}
      - QS_SMTP_PASSWORD=${QS_SMTP_PASSWORD:-}
      - QS_GOOGLE_CLIENT_ID=${QS_GOOGLE_CLIENT_ID:-}
      - QS_GOOGLE_CLIENT_SECRET=${QS_GOOGLE_CLIENT_SECRET:-}
      - QS_GITHUB_CLIENT_ID=${QS_GITHUB_CLIENT_ID:-}
      - QS_GITHUB_CLIENT_SECRET=${QS_GITHUB_CLIENT_SECRET:-}
      - QS_DISCORD_CLIENT_ID=${QS_DISCORD_CLIENT_ID:-}
      - QS_DISCORD_CLIENT_SECRET=${QS_DISCORD_CLIENT_SECRET:-}
      - QS_VICTORIA_LOGS_URL=http://victorialogs:9428
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/healthz || exit 1"]
      interval: 200ms
      timeout: 2s
      retries: 100
      start_period: 15s

  ops-api:
    image: ${QS_IMAGE_REGISTRY:-quadsmith}/server-ops-api:${QS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: src/go/server-ops-api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPS_PORT:-8082}:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - QS_ENV=${QS_ENV:-sandbox}
      - QS_REGION=${QS_REGION:-local}
      - QS_CONFIG=/app/src/go/server-ops-api/config/${QS_ENV:-sandbox}.textproto
      - QS_DATABASE_URL=${QS_DATABASE_URL:-postgres://postgres:postgres@host.docker.internal:${DB_PORT:-5432}/quadsmith_api?sslmode=disable}
      - QS_INTERNAL_DATABASE_URL=${QS_INTERNAL_DATABASE_URL:-postgres://postgres:postgres@host.docker.internal:${DB_PORT:-5432}/quadsmith_ops?sslmode=disable}
      - QS_AUTH_SECRET=${QS_AUTH_SECRET:-}
      - QS_OAUTH_CLIENT_ID=${QS_OAUTH_CLIENT_ID:-}
      - QS_OAUTH_CLIENT_SECRET=${QS_OAUTH_CLIENT_SECRET:-}
      - QS_PEER_API_HEALTHZ=http://api:8081/healthz
      - QS_PEER_WEB_HEALTHZ=http://web:8080/healthz
      - QS_PEER_OPS_WEB_HEALTHZ=http://ops-web:8083/healthz
      - QS_PEER_CRON_HEALTHZ=http://cron:8084/healthz
      - QS_VICTORIA_LOGS_URL=http://victorialogs:9428
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8082/healthz || exit 1"]
      interval: 200ms
      timeout: 2s
      retries: 100
      start_period: 15s

  ops-web:
    image: ${QS_IMAGE_REGISTRY:-quadsmith}/server-ops-web:${QS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: src/go/server-ops-web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPS_WEB_PORT:-8083}:8083"
    environment:
      - QS_ENV=${QS_ENV:-sandbox}
      - QS_REGION=${QS_REGION:-local}
      - QS_CONFIG=/app/src/go/server-ops-web/config/${QS_ENV:-sandbox}.textproto
      - QS_OPS_API_URL=http://ops-api:8082
      - QS_GRAFANA_URL=http://grafana:3000
      - QS_VICTORIA_LOGS_URL=http://victorialogs:9428
    depends_on:
      ops-api:
        condition: service_healthy
      grafana:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8083/healthz || exit 1"]
      interval: 200ms
      timeout: 2s
      retries: 100
      start_period: 15s

  cron:
    image: ${QS_IMAGE_REGISTRY:-quadsmith}/server-cron:${QS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: src/go/server-cron/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CRON_PORT:-8084}:8084"
    environment:
      - QS_ENV=${QS_ENV:-sandbox}
      - QS_REGION=${QS_REGION:-local}
      - QS_CONFIG=/app/src/go/server-cron/config/${QS_ENV:-sandbox}.textproto
      - QS_OPS_SERVER_URL=http://ops-api:8082
      - QS_JOB_SERVER_AUTH_TOKEN=${QS_JOB_SERVER_AUTH_TOKEN:-}
      - QS_VICTORIA_LOGS_URL=http://victorialogs:9428
    depends_on:
      ops-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8084/healthz || exit 1"]
      interval: 200ms
      timeout: 2s
      retries: 100
      start_period: 15s

  web:
    image: ${QS_IMAGE_REGISTRY:-quadsmith}/server-web:${QS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: src/go/server-web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      - QS_ENV=${QS_ENV:-sandbox}
      - QS_REGION=${QS_REGION:-local}
      - QS_CONFIG=/app/src/go/server-web/config/${QS_ENV:-sandbox}.textproto
      - QS_API_URL=http://api:8081
      - QS_VICTORIA_LOGS_URL=http://victorialogs:9428
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz || exit 1"]
      interval: 200ms
      timeout: 2s
      retries: 100
      start_period: 15s

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.115.0
    restart: unless-stopped
    command:
      - "-promscrape.config=/etc/victoriametrics/scrape.yml"
      - "-retentionPeriod=30d"
      - "-storageDataPath=/storage"
    volumes:
      - ./victoriametrics/scrape.yml:/etc/victoriametrics/scrape.yml:ro
      - vm_data:/storage

  victorialogs:
    image: victoriametrics/victoria-logs:v1.15.0-victorialogs
    restart: unless-stopped
    command:
      - "-retentionPeriod=14d"
      - "-storageDataPath=/vlogs"
    volumes:
      - vl_data:/vlogs

  grafana:
    image: grafana/grafana-oss:11.5.2
    restart: unless-stopped
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - victoriametrics
      - victorialogs

volumes:
  vm_data:
  vl_data:
  grafana_data:
