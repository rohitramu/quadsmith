global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "quadsmith-services"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "api:8080"
          - "web:8080"
          - "ops-api:8080"
          - "ops-web:8080"
          - "cron:8080"
          - "api-blue:8080"
          - "web-blue:8080"
          - "ops-api-blue:8080"
          - "ops-web-blue:8080"
          - "cron-blue:8080"
          - "api-green:8080"
          - "web-green:8080"
          - "ops-api-green:8080"
          - "ops-web-green:8080"
          - "cron-green:8080"
