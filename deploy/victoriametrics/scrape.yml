global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "quadsmith-services"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "web:8080"
          - "api:8081"
          - "ops-api:8082"
          - "ops-web:8083"
          - "cron:8084"
          - "web-blue:8080"
          - "api-blue:8081"
          - "ops-api-blue:8082"
          - "ops-web-blue:8083"
          - "cron-blue:8084"
          - "web-green:8080"
          - "api-green:8081"
          - "ops-api-green:8082"
          - "ops-web-green:8083"
          - "cron-green:8084"
