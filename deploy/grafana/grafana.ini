[server]
http_port = 3000
root_url = %(protocol)s://%(domain)s:%(http_port)s/grafana/
serve_from_sub_path = true

[security]
allow_embedding = true
cookie_samesite = lax
csrf_always_check = false

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/json/quadsmith_service_health.json

[auth]
disable_login_form = true

[auth.anonymous]
enabled = false

[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
headers = Role:X-WEBAUTH-ROLE

[users]
default_theme = dark

[database]
wal = true

[log]
level = warn
filters = http.server:info migrator:error resource-migrator:error local.finder:error folder-service:error resource-server:error
