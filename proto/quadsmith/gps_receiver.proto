syntax = "proto3";

package quadsmith;

import "_common.proto";
import "_sql.proto";
import "reference_link.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// Domain Model
// ---------------------------------------------------------
message GpsReceiver {
  option (quadsmith.name) = {
    singular: "GPS Receiver"
    plural: "GPS Receivers"
  };
  option (quadsmith.sql.table) = {name: "gps_receivers"};
  option (quadsmith.frontend) = {
    default_columns: [
      "manufacturer",
      "name",
      "chipset",
      "has_compass"
    ]
  };

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];

  string id = 2 [(quadsmith.sql.column) = {is_unique: true}];

  string manufacturer = 3 [(quadsmith.sql.column) = {create_index: true}];
  string name = 4;
  bool is_internal_only = 20;

  float weight_g = 5;

  // GNSS chipset (e.g., "u-blox MAX-M10S", "u-blox M10", "M10050")
  string chipset = 6;

  // Primary communication protocol (e.g., "UBLOX", "NMEA")
  string protocol = 7 [(quadsmith.sql.column) = {create_index: true}];

  // Whether the unit has an integrated magnetic compass / magnetometer
  optional bool has_compass = 8;

  // Compass chip model (e.g., "QMC5883L", "IST8310")
  optional string compass_chip = 9;

  // Minimum operating input voltage
  float input_voltage_min_v = 10;

  // Maximum operating input voltage
  float input_voltage_max_v = 11;

  string description = 21;
  repeated ReferenceLink reference_links = 22;
}

// ---------------------------------------------------------
// RPC Requests & Responses
// ---------------------------------------------------------
message GetGpsReceiverRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListGpsReceiversRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListGpsReceiversResponse {
  repeated GpsReceiver gps_receivers = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------
// gRPC Service
// ---------------------------------------------------------
service GpsReceiverService {
  rpc GetGpsReceiver(GetGpsReceiverRequest) returns (GpsReceiver);
  rpc ListGpsReceivers(ListGpsReceiversRequest) returns (ListGpsReceiversResponse);
}
