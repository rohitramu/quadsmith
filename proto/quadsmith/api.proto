edition = "2023";

import "google/protobuf/go_features.proto";
option features.(pb.go).api_level = API_OPAQUE;


package quadsmith;
option go_package = "quadsmith/api/gen/quadsmith;quadsmith";

import "quadsmith/common.proto";
import "quadsmith/component.proto";

message ListComponentsRequest {
  string component_type = 1;
  string filter = 2;       // CEL filter expression, e.g. 'motor.kv_rating >= 1800'
  string order_by = 3;     // Order expression, e.g. 'motor.kv_rating desc, name asc'
  int32 page_size = 4;     // Maximum items to return
  string page_token = 5;   // Cursor token
  repeated string field_mask = 6; // Requested fields using dot-notation
}

message ListComponentsResponse {
  repeated Component components = 1;
  string next_page_token = 2; // Opaque cursor for next page
  int32 total_count = 3;
}

message GetComponentRequest {
  string id = 1;
  repeated string field_mask = 2;
}


import "quadsmith/evaluator.proto";
import "quadsmith/compatibility.proto";
import "quadsmith/build.proto";

message CreateComponentRequest { Component component = 1; }
message UpdateComponentRequest { Component component = 1; }
message DeleteComponentRequest { string id = 1; }
message DeleteComponentResponse {}

message ListBuildsRequest {
  string filter = 1;
  repeated string field_mask = 2;
}
message ListBuildsResponse {
  repeated Build builds = 1;
}
message GetBuildRequest { 
  string id = 1; 
  repeated string field_mask = 2;
}
message CreateBuildRequest { Build build = 1; }
message UpdateBuildRequest { Build build = 1; }
message DeleteBuildRequest { string id = 1; }
message DeleteBuildResponse {}

service QuadsmithAPI {
  // Components (Hardware, Gear, Software)
  rpc ListComponents(ListComponentsRequest) returns (ListComponentsResponse);
  rpc GetComponent(GetComponentRequest) returns (Component);
  rpc CreateComponent(CreateComponentRequest) returns (Component);
  rpc UpdateComponent(UpdateComponentRequest) returns (Component);
  rpc DeleteComponent(DeleteComponentRequest) returns (DeleteComponentResponse);
  
  // Builds
  rpc ListBuilds(ListBuildsRequest) returns (ListBuildsResponse);
  rpc GetBuild(GetBuildRequest) returns (Build);
  rpc CreateBuild(CreateBuildRequest) returns (Build);
  rpc UpdateBuild(UpdateBuildRequest) returns (Build);
  rpc DeleteBuild(DeleteBuildRequest) returns (DeleteBuildResponse);
  
  // Engines
  rpc EvaluateBuild(EvaluateBuildRequest) returns (EvaluateBuildResponse);
  rpc CheckCompatibility(CheckCompatibilityRequest) returns (CheckCompatibilityResponse);
}
