syntax = "proto3";

package quadsmith;

import "_common.proto";
import "_sql.proto";
import "reference_link.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// Domain Model
// ---------------------------------------------------------
message FlightController {
  option (quadsmith.name) = {
    singular: "Flight Controller"
    plural: "Flight Controllers"
  };
  option (quadsmith.sql.table) = {name: "flight_controllers"};

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];

  string id = 2 [(quadsmith.sql.column) = {is_unique: true}];

  string manufacturer = 3 [(quadsmith.sql.column) = {create_index: true}];
  string name = 4;
  bool is_internal_only = 20;

  float weight_g = 5;

  // The MCU processor (e.g., "F411", "F405", "H743")
  string processor = 6;

  // The gyro chip (e.g., "MPU6000", "BMI270")
  string gyro = 7;

  // -------------------------------------------------------
  // Integrated Components (AIO Support)
  // -------------------------------------------------------

  // If this board has an integrated Electronic Speed Controller, reference it here
  optional string internal_electronic_speed_controller_uuid = 8 [(quadsmith.sql.column) = {references: "electronic_speed_controllers(uuid)"}];

  // If this board has an integrated SPI or Serial Receiver
  optional string internal_receiver_uuid = 9 [(quadsmith.sql.column) = {references: "receivers(uuid)"}];

  // If this board has an integrated Video Transmitter
  optional string internal_video_transmitter_uuid = 10 [(quadsmith.sql.column) = {references: "video_transmitters(uuid)"}];
  string description = 21;
  repeated ReferenceLink reference_links = 22;
}

// ---------------------------------------------------------
// RPC Requests & Responses
// ---------------------------------------------------------
message GetFlightControllerRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListFlightControllersRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListFlightControllersResponse {
  repeated FlightController flight_controllers = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------
// gRPC Service
// ---------------------------------------------------------
service FlightControllerService {
  rpc GetFlightController(GetFlightControllerRequest) returns (FlightController);
  rpc ListFlightControllers(ListFlightControllersRequest) returns (ListFlightControllersResponse);
}
