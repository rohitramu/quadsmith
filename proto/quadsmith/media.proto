syntax = "proto3";

package quadsmith;

option go_package = "quadsmith/api/gen/quadsmith";

enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_IMAGE = 1;
  MEDIA_TYPE_YOUTUBE = 2;
}

message Media {
  MediaType type = 1;
  string url = 2;
  optional string title = 3;
  optional string description = 4;
}
