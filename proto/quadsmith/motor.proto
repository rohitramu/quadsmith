syntax = "proto3";

package quadsmith;

import "quadsmith/sql.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// Domain Model
// ---------------------------------------------------------
message Motor {
  // This tells the Go generator to create a 'motors' table for this message
  option (quadsmith.sql.table_name) = "motors";

  string uuid = 1 [(quadsmith.sql.is_primary_key) = true];

  // A unique, human-readable slug (e.g., "tmotor-f80-pro-1900kv")
  string id = 2 [(quadsmith.sql.is_unique) = true];

  string manufacturer = 3 [(quadsmith.sql.create_index) = true];
  string name = 4;

  float weight_g = 5;
  float stator_diameter_mm = 6;
  float stator_height_mm = 7;
  uint32 kv = 8 [(quadsmith.sql.create_index) = true];
  string description = 9;
}

// ---------------------------------------------------------
// RPC Requests & Responses
// ---------------------------------------------------------
message GetMotorRequest {
  // Can be the UUID or the human-readable slug
  string id = 1;
  repeated string columns = 2;
}

message ListMotorsRequest {
  // A CEL query string (e.g., "weight_g < 30.0 && kv >= 2000")
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListMotorsResponse {
  repeated Motor motors = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------
// gRPC Service
// ---------------------------------------------------------
service MotorService {
  rpc GetMotor(GetMotorRequest) returns (Motor);
  rpc ListMotors(ListMotorsRequest) returns (ListMotorsResponse);
}
