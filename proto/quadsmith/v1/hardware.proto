syntax = "proto3";

package quadsmith.v1;

import "quadsmith/v1/common.proto";

message FrameProfile {
  int32 wheelbase_mm = 1;
  double max_prop_size_mm = 2;
  repeated string fc_stack_mount_ids = 3;
  repeated string vtx_mount_ids = 4;
  repeated string motor_mount_pattern_ids = 5;
  double camera_mount_width_mm = 6;
  optional double max_battery_length_mm = 7;
  optional double max_battery_width_mm = 8;
  optional double max_battery_height_mm = 9;
}

message MotorProfile {
  string stator_size = 1;
  int32 kv_rating = 2;
  double input_voltage_min_v = 3;
  double input_voltage_max_v = 4;
  repeated string mount_pattern_ids = 5;
  string mount_bolt_size = 6;
  string shaft_type = 7;
  optional double max_current_a = 8;
}

message PropellerProfile {
  double diameter_mm = 1;
  double pitch_mm = 2;
  int32 blade_count = 3;
  string mount_type = 4;
  repeated string recommended_stators = 5;
}

message FlightControllerProfile {
  repeated string mount_pattern_ids = 1;
  double board_height_mm = 2;
  string mcu_processor = 3;
  optional string gyro_sensor = 4;
  double input_voltage_min_v = 5;
  double input_voltage_max_v = 6;
  string esc_interface = 7;
  repeated string supported_firmware_ids = 8;
  string bec_outputs_json = 9;
  string uart_connections_json = 10;
}

message EscProfile {
  EscFormFactor form_factor = 1;
  repeated string mount_pattern_ids = 2;
  double board_height_mm = 3;
  double continuous_current_a = 4;
  double burst_current_a = 5;
  double input_voltage_min_v = 6;
  double input_voltage_max_v = 7;
  repeated string supported_firmware_ids = 8;
}

message BatteryProfile {
  string chemistry_id = 1;
  int32 cell_count_s = 2;
  int32 cell_count_p = 3;
  int32 capacity_mah = 4;
  int32 continuous_c_rating = 5;
  string connector_type_id = 6;
  optional double length_mm = 7;
  optional double width_mm = 8;
  optional double height_mm = 9;
}

message VtxProfile {
  repeated string supported_frequency_ids = 1;
  string ecosystem_id = 2;
  optional string video_connection_standard = 3;
  repeated string mount_pattern_ids = 4;
  double board_height_mm = 5;
  double input_voltage_min_v = 6;
  double input_voltage_max_v = 7;
  optional int32 max_power_mw = 8;
  int32 antenna_count = 9;
  optional string antenna_connector_id = 10;
  optional string included_antenna_polarization_id = 11;
  repeated string supported_firmware_ids = 12;
}

message CameraProfile {
  string ecosystem_id = 1;
  optional string video_connection_standard = 2;
  double width_mm = 3;
  double height_mm = 4;
  double depth_mm = 5;
  double input_voltage_min_v = 6;
  double input_voltage_max_v = 7;
  string mounting_screw_size = 8;
  string aspect_ratio = 9;
}

message ReceiverProfile {
  repeated string supported_frequency_ids = 1;
  repeated string rf_protocol_ids = 2;
  string output_protocol = 3;
  double input_voltage_min_v = 4;
  double input_voltage_max_v = 5;
  int32 antenna_count = 6;
  optional string antenna_connector_id = 7;
  optional string included_antenna_polarization_id = 8;
}

message GpsProfile {
  string chipset = 1;
  bool has_compass = 2;
  double input_voltage_min_v = 3;
  double input_voltage_max_v = 4;
  optional double length_mm = 5;
  optional double width_mm = 6;
  optional double height_mm = 7;
}

message AntennaProfile {
  string supported_frequency_id = 1;
  string polarization_id = 2;
  string connector_id = 3;
  string antenna_style = 4;
  optional double gain_dbi = 5;
  optional double cable_length_mm = 6;
}

message TransmitterProfile {
  repeated string supported_frequency_ids = 1;
  repeated string rf_protocol_ids = 2;
  string external_bay_type = 3;
  int32 antenna_count = 4;
  optional string antenna_connector_id = 5;
  optional string included_antenna_polarization_id = 6;
  repeated string supported_os_ids = 7;
}

message GogglesProfile {
  repeated string supported_frequency_ids = 1;
  string ecosystem_id = 2;
  int32 antenna_count = 3;
  optional string antenna_connector_id = 4;
  optional string included_antenna_polarization_id = 5;
}
