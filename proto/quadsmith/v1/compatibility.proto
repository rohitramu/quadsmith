syntax = "proto3";

package quadsmith.v1;
option go_package = "quadsmith/db/gen/quadsmith/v1;quadsmithv1";

enum SeverityLevel {
  SEVERITY_LEVEL_UNSPECIFIED = 0;
  SEVERITY_LEVEL_DEFINITE_INCOMPATIBILITY = 1;
  SEVERITY_LEVEL_HEURISTIC_INCOMPATIBILITY = 2;
  SEVERITY_LEVEL_PARTIAL_COMPATIBILITY = 3;
  SEVERITY_LEVEL_INFORMATIONAL = 4;
}

message CompatibilityMessage {
  int32 severity_level_num = 1; // 0 for highest priority, etc.
  SeverityLevel severity_name = 2;
  string message = 3;
  string resolution = 4;
}

message CompatibilityMetric {
  // Using a oneof to capture the various specific metrics telemetry defined in the design spec
  oneof metric_data {
    CurrentDrawMetric current_draw = 1;
    MountMatchMetric mount_match = 2;
    VoltageMetric voltage = 3;
    UartMetric uart = 4;
    // We can add more specific metrics here as we build them out
  }
}

message CurrentDrawMetric {
  double value = 1;
  double max = 2;
  string unit = 3; // e.g. "A"
}

message MountMatchMetric {
  repeated string expected = 1;
  repeated string actual = 2;
}

message VoltageMetric {
  double value = 1;
  double min = 2;
  double max = 3;
  string unit = 4; // e.g. "V"
}

message UartMetric {
  int32 required = 1;
  int32 available = 2;
}

message CompatibilityResult {
  repeated string component_ids = 1;
  string checker_name = 2;
  CompatibilityMetric metrics = 3;
  repeated CompatibilityMessage messages = 4;
}

message CheckCompatibilityRequest {
  repeated string component_ids = 1; // Arbitrary array of components
}

message CheckCompatibilityResponse {
  repeated CompatibilityResult results = 1;
}
