syntax = "proto3";

package quadsmith;

import "_common.proto";
import "_sql.proto";
import "media.proto";
import "reference_link.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// Domain Model
// ---------------------------------------------------------
message Camera {
  option (quadsmith.name) = {
    singular: "Camera"
    plural: "Cameras"
  };
  option (quadsmith.sql.table) = {name: "cameras"};
  option (quadsmith.collection_path) = "components/hardware/cameras";
  option (quadsmith.frontend) = {
    default_columns: [
      "manufacturer",
      "name",
      "protocol",
      "width_mm"
    ]
  };

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];

  string id = 2 [(quadsmith.sql.column) = {is_unique: true}];

  string manufacturer = 3 [(quadsmith.sql.column) = {create_index: true}];
  string name = 4;
  bool is_internal_only = 5;

  float weight_g = 6;

  // Protocol / signal type (e.g., "Analog", "DJI O3", "DJI O4", "Walksnail Avatar", "HDZero")
  string protocol = 7;

  // Sensor size (e.g., "1/3 CMOS", "1/1.8 CMOS")
  string sensor_size = 8;

  // Width of the camera body in mm (e.g., 14 for nano, 19 for micro, 22 for standard)
  uint32 width_mm = 9;

  // Lens focal length or FOV descriptor (e.g., 1.8, 2.1)
  float lens_size_mm = 10;
  string description = 11;
  repeated ReferenceLink reference_links = 12;
  optional string primary_display_image = 13;
  repeated Media media = 14;
}

// ---------------------------------------------------------
// RPC Requests & Responses
// ---------------------------------------------------------
message GetCameraRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListCamerasRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListCamerasResponse {
  repeated Camera cameras = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------
// gRPC Service
// ---------------------------------------------------------
service CameraService {
  rpc GetCamera(GetCameraRequest) returns (Camera);
  rpc ListCameras(ListCamerasRequest) returns (ListCamerasResponse);
}
