syntax = "proto3";

package quadsmith;

import "_common.proto";
import "_sql.proto";
import "media.proto";
import "reference_link.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// Domain Model
// ---------------------------------------------------------
message SoftwareTool {
  option (quadsmith.sql.table) = {name: "software_tools"};
  option (quadsmith.collection_path) = "components/software/software-tools";
  option (quadsmith.frontend) = {
    color_code: "#a855f7"
    default_columns: [
      "manufacturer",
      "name",
      "version",
      "category",
      "platform"
    ]
  };

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  string id = 2 [(quadsmith.sql.column) = {is_unique: true}];
  string manufacturer = 3 [(quadsmith.sql.column) = {create_index: true}];
  string name = 4;
  string version = 5;
  string category = 6;
  string platform = 7;
  string description = 8;
  repeated ReferenceLink reference_links = 9;
  optional string primary_display_image = 10;
  repeated Media media = 11;
}

// ---------------------------------------------------------
// RPC Requests & Responses
// ---------------------------------------------------------
message GetSoftwareToolRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListSoftwareToolsRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListSoftwareToolsResponse {
  repeated SoftwareTool software_tools = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------
// gRPC Service
// ---------------------------------------------------------
service SoftwareToolService {
  rpc GetSoftwareTool(GetSoftwareToolRequest) returns (SoftwareTool);
  rpc ListSoftwareTools(ListSoftwareToolsRequest) returns (ListSoftwareToolsResponse);
}
