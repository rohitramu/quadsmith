syntax = "proto3";

package quadsmith;

import "google/protobuf/descriptor.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// Entity Naming Options
// ---------------------------------------------------------

message NameOptions {
  // Title case with spaces (e.g., "Video Transmitter")
  string singular = 1;

  // Title case with spaces (e.g., "Video Transmitters")
  string plural = 2;
}

// ---------------------------------------------------------
// Frontend Options
// ---------------------------------------------------------

message FrontendOptions {
  // The default columns to display in CLI tables and UI collection listings.
  repeated string default_columns = 1;

  // The collection path (e.g., "components/hardware/motors" or "builds").
  // The UI's URL paths and the CLI's subcommand structure align with this.
  string path = 2;
}

// ---------------------------------------------------------
// Custom Message Options
// ---------------------------------------------------------

extend google.protobuf.MessageOptions {
  // Frontend configuration for UI and CLI listings.
  FrontendOptions frontend = 50001;

  // Human-readable entity names for UI, CLI, and code generators.
  NameOptions name = 50002;

  // Direct collection path option (e.g., "components/hardware/motors" or "builds").
  string collection_path = 50003;
}
