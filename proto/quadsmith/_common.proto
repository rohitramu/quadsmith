syntax = "proto3";

package quadsmith;

import "google/protobuf/descriptor.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// Frontend Options
// ---------------------------------------------------------

message FrontendOptions {
  // The default columns to display in CLI tables and UI collection listings.
  repeated string default_columns = 1;

  reserved 2;
  reserved "path";
}

// ---------------------------------------------------------
// Custom Message Options
// ---------------------------------------------------------

extend google.protobuf.MessageOptions {
  // Frontend configuration for UI and CLI listings.
  FrontendOptions frontend = 50001;

  // Direct collection path option (e.g., "components/hardware/motors" or "builds").
  string collection_path = 50003;
}
