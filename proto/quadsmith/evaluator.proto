syntax = "proto3";

package quadsmith;

import "build.proto";

option go_package = "quadsmith/api/gen/quadsmith";

message EvaluateBuildRequest {
  // A complete or partial Build object. The backend will look up the referenced
  // UUIDs/IDs to fetch the actual components for evaluation.
  Build build = 1;
  float payload_weight_g = 2;
}

message EvaluateBuildResponse {
  float total_weight_g = 1;
  float hover_throttle_percent = 2;
  float thrust_to_weight_ratio = 3;
  float estimated_flight_time_min = 4;

  // Non-blocking issues (e.g. "Motors might overheat on 6S")
  repeated string warnings = 5;

  // Blocking compatibility issues (e.g. "ESC is 4S max but Battery is 6S")
  repeated string errors = 6;

  // Flight time range (minutes) based on flight aggression:
  // min_flight_time_min: Aggressive freestyle / acro / sustained punchouts
  // max_flight_time_min: Gentle cruising / cinematic forward flight
  float min_flight_time_min = 7;
  float max_flight_time_min = 8;

  // Maximum vertical punchout acceleration in m/s^2 (meters per second squared)
  float max_acceleration_mps2 = 9;

  // Estimated terminal forward top speed in km/h (drag and pitch speed limited)
  float top_speed_kmh = 10;

  // Average propeller RPM at hover under standard conditions (sea-level, no wind)
  uint32 hover_rpm = 11;
}

service EvaluatorService {
  rpc EvaluateBuild(EvaluateBuildRequest) returns (EvaluateBuildResponse);
}
