syntax = "proto3";

package quadsmith;

import "battery.proto";
import "build.proto";
import "components.proto";

option go_package = "quadsmith/api/gen/quadsmith";

enum SystemMessageSeverity {
  SYSTEM_MESSAGE_SEVERITY_UNSPECIFIED = 0;
  SYSTEM_MESSAGE_SEVERITY_INFO = 1;
  SYSTEM_MESSAGE_SEVERITY_WARNING = 2;
  SYSTEM_MESSAGE_SEVERITY_ERROR = 3;
}

message SystemMessage {
  SystemMessageSeverity severity = 1;
  string message = 2;
}

message EvaluateBuildRequest {
  oneof build_source {
    // Required build ID or UUID to evaluate.
    string build_id = 1;
    // In-memory Build object to evaluate draft without saving to database.
    Build build = 4;
  }
  float payload_weight_g = 2;

  // Required battery ID or UUID to evaluate the build with.
  string battery_id = 3;
}

message EvaluateBuildResponse {
  // Total build weight (All-Up Weight) in grams, including the build components, battery, and payload
  float all_up_weight_g = 1;
  float hover_throttle_percent = 2;
  float thrust_to_weight_ratio = 3;

  // Flight time range (minutes) based on flight aggression:
  // min_flight_time_min: Aggressive freestyle / acro / sustained punchouts
  // max_flight_time_min: Gentle cruising / cinematic forward flight
  float min_flight_time_min = 7;
  float max_flight_time_min = 8;

  // Maximum vertical punchout acceleration in m/s^2 (meters per second squared)
  float max_acceleration_mps2 = 9;

  // Estimated terminal forward top speed in km/h (drag and pitch speed limited)
  float top_speed_kmh = 10;

  // Average propeller RPM at hover under standard conditions (sea-level, no wind)
  uint32 hover_rpm = 11;

  // System diagnostic messages (errors, warnings, and informational notices)
  repeated SystemMessage system_messages = 12;

  // Evaluated input parameters
  string build_id = 13;
  float payload_weight_g = 14;
  string battery_id = 15;

  // Electrical limits determined by the build's FC, ESCs, and Motors
  float min_voltage = 16;
  float max_voltage = 17;
  float max_current_a = 18;

  reserved 4, 5, 6, 19;
  reserved "estimated_flight_time_min", "warnings", "errors", "build_weight_g", "total_weight_g";
}

message GetBuildElectricalLimitsRequest {
  oneof build_source {
    // Required build ID or UUID.
    string build_id = 1;
    // In-memory Build object.
    Build build = 2;
  }
}

message GetBuildElectricalLimitsResponse {
  float min_voltage = 1;
  float max_voltage = 2;
  float max_current_a = 3;
  // Lightest compatible battery ID recommended for this build
  string default_battery_id = 4;
  string build_id = 5;
}

message EvaluateComponentsRequest {
  AssembledComponents components = 1;
  float payload_weight_g = 2;
}

message GetComponentsElectricalLimitsRequest {
  AssembledComponents components = 1;
  repeated Battery candidate_batteries = 2;
}

service EvaluatorService {
  rpc EvaluateBuild(EvaluateBuildRequest) returns (EvaluateBuildResponse);
  rpc GetBuildElectricalLimits(GetBuildElectricalLimitsRequest) returns (GetBuildElectricalLimitsResponse);
  rpc EvaluateComponents(EvaluateComponentsRequest) returns (EvaluateBuildResponse);
  rpc GetComponentsElectricalLimits(GetComponentsElectricalLimitsRequest) returns (GetBuildElectricalLimitsResponse);
}
