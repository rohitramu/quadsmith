syntax = "proto3";

package quadsmith;

import "_common.proto";
import "_sql.proto";
import "media.proto";
import "reference_link.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// Domain Model
// ---------------------------------------------------------
message Antenna {
  option (quadsmith.sql.table) = {name: "antennas"};
  option (quadsmith.collection_path) = "components/hardware/antennas";
  option (quadsmith.frontend) = {
    color_code: "#eab308"
    default_columns: [
      "manufacturer",
      "name",
      "connector",
      "polarization",
      "frequency_band_mhz",
      "gain_dbi"
    ]
  };

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];

  string id = 2 [(quadsmith.sql.column) = {is_unique: true}];

  string manufacturer = 3 [(quadsmith.sql.column) = {create_index: true}];
  string name = 4;
  bool is_internal_only = 5;

  float weight_g = 6;

  // E.g., "U.FL", "MMCX", "SMA", "RP-SMA"
  string connector = 7;

  // E.g., "RHCP", "LHCP", "Linear"
  string polarization = 8;

  // Center frequency in GHz (e.g., 5.8, 2.4, 0.9)
  uint32 frequency_band_mhz = 9;

  // Length in millimeters (e.g., 60, 100, 150)
  float length_mm = 10;

  // Gain in dBi (e.g., 2.5, 3.0)
  float gain_dbi = 11;
  string description = 12;
  repeated ReferenceLink reference_links = 13;
  optional string primary_display_image = 14;
  repeated Media media = 15;
}

// ---------------------------------------------------------
// RPC Requests & Responses
// ---------------------------------------------------------
message GetAntennaRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListAntennasRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListAntennasResponse {
  repeated Antenna antennas = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------
// gRPC Service
// ---------------------------------------------------------
service AntennaService {
  rpc GetAntenna(GetAntennaRequest) returns (Antenna);
  rpc ListAntennas(ListAntennasRequest) returns (ListAntennasResponse);
}
