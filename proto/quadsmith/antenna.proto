syntax = "proto3";

package quadsmith;

import "quadsmith/_common.proto";
import "quadsmith/_sql.proto";
import "quadsmith/reference_link.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// Domain Model
// ---------------------------------------------------------
message Antenna {
  option (quadsmith.name) = {
    singular: "Antenna"
    plural: "Antennas"
  };
  option (quadsmith.sql.table_name) = "antennas";

  string uuid = 1 [(quadsmith.sql.is_primary_key) = true];

  string id = 2 [(quadsmith.sql.is_unique) = true];

  string manufacturer = 3 [(quadsmith.sql.create_index) = true];
  string name = 4;
  bool is_internal_only = 20;

  float weight_g = 5;

  // E.g., "U.FL", "MMCX", "SMA", "RP-SMA"
  string connector = 6;

  // E.g., "RHCP", "LHCP", "Linear"
  string polarization = 7;

  // Center frequency in GHz (e.g., 5.8, 2.4, 0.9)
  uint32 frequency_band_mhz = 8;

  // Length in millimeters (e.g., 60, 100, 150)
  float length_mm = 9;

  // Gain in dBi (e.g., 2.5, 3.0)
  float gain_dbi = 10;
  string description = 21;
  repeated ReferenceLink reference_links = 22;
}

// ---------------------------------------------------------
// RPC Requests & Responses
// ---------------------------------------------------------
message GetAntennaRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListAntennasRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListAntennasResponse {
  repeated Antenna antennas = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------
// gRPC Service
// ---------------------------------------------------------
service AntennaService {
  rpc GetAntenna(GetAntennaRequest) returns (Antenna);
  rpc ListAntennas(ListAntennasRequest) returns (ListAntennasResponse);
}
