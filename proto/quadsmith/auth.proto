syntax = "proto3";

package quadsmith;

import "_common.proto";
import "_sql.proto";
import "google/protobuf/timestamp.proto";
import "user.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// Authentication Requests & Responses
// ---------------------------------------------------------

message SendEmailOtpRequest {
  string email = 1;
}

message SendEmailOtpResponse {
  bool success = 1;
  string message = 2;
  int32 cooldown_seconds = 3;
  bool is_existing_account = 4;
}

message VerifyEmailOtpRequest {
  string email = 1;
  string code = 2;
}

message VerifyMagicLinkRequest {
  string token = 1;
}

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  User user = 3;
  UserProfile profile = 4;
}

message OtpVerificationError {
  string message = 1;
  int32 remaining_attempts = 2;
  int32 max_attempts = 3;
  bool is_exhausted = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message GetCurrentUserRequest {}

message UpdateProfileRequest {
  optional string display_name = 1;
  optional string avatar_url = 2;
  optional string bio = 3;
}

message LogoutRequest {
  optional string refresh_token = 1;
}

message LogoutResponse {
  bool success = 1;
}

message ListUserEmailsRequest {}

message ListUserEmailsResponse {
  repeated UserEmail emails = 1;
}

message SendAddEmailOtpRequest {
  string email = 1;
}

message VerifyAddEmailOtpRequest {
  string email = 1;
  string code = 2;
  string token = 3;
}

message VerifyAddEmailOtpResponse {
  bool success = 1;
  string message = 2;
  bool merge_required = 3;
  string other_user_handle = 4;
  int32 other_build_count = 5;
  repeated string other_build_names = 6;
  repeated string other_emails = 7;
  repeated string other_oauth_providers = 8;
}

message MergeAccountRequest {
  string email = 1;
  string code = 2;
  string token = 3;
}

message MergeAccountResponse {
  bool success = 1;
  string message = 2;
  int32 transferred_build_count = 3;
  string merged_handle = 4;
}

message SetPrimaryEmailRequest {
  string email = 1;
}

message SetPrimaryEmailResponse {
  bool success = 1;
  string message = 2;
}

message RemoveUserEmailRequest {
  string email = 1;
}

message RemoveUserEmailResponse {
  bool success = 1;
  string message = 2;
}

// ---------------------------------------------------------
// Authentication Service
// ---------------------------------------------------------

service AuthService {
  rpc SendEmailOtp(SendEmailOtpRequest) returns (SendEmailOtpResponse);
  rpc VerifyEmailOtp(VerifyEmailOtpRequest) returns (AuthResponse);
  rpc VerifyMagicLink(VerifyMagicLinkRequest) returns (AuthResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (AuthResponse);
  rpc GetCurrentUser(GetCurrentUserRequest) returns (User);
  rpc UpdateProfile(UpdateProfileRequest) returns (UserProfile);
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  rpc ListUserEmails(ListUserEmailsRequest) returns (ListUserEmailsResponse);
  rpc SendAddEmailOtp(SendAddEmailOtpRequest) returns (SendEmailOtpResponse);
  rpc VerifyAddEmailOtp(VerifyAddEmailOtpRequest) returns (VerifyAddEmailOtpResponse);
  rpc MergeAccount(MergeAccountRequest) returns (MergeAccountResponse);
  rpc SetPrimaryEmail(SetPrimaryEmailRequest) returns (SetPrimaryEmailResponse);
  rpc RemoveUserEmail(RemoveUserEmailRequest) returns (RemoveUserEmailResponse);
}
