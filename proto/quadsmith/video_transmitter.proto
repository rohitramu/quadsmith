syntax = "proto3";

package quadsmith;

import "_common.proto";
import "_sql.proto";
import "media.proto";
import "reference_link.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// Domain Model
// ---------------------------------------------------------
message VideoTransmitter {
  option (quadsmith.sql.table) = {name: "video_transmitters"};
  option (quadsmith.collection_path) = "components/hardware/video-transmitters";
  option (quadsmith.frontend) = {
    default_columns: [
      "manufacturer",
      "name",
      "protocol",
      "max_power_mw",
      "weight_g"
    ]
  };

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];

  string id = 2 [(quadsmith.sql.column) = {is_unique: true}];

  string manufacturer = 3 [(quadsmith.sql.column) = {create_index: true}];
  string name = 4;
  bool is_internal_only = 5;

  float weight_g = 6;

  // E.g., "Analog", "DJI O3", "Walksnail Avatar", "HDZero"
  string protocol = 7 [(quadsmith.sql.column) = {create_index: true}];

  // Max output power in milliwatts (e.g., 800, 1000, 1200)
  uint32 max_power_mw = 8;

  // Input voltage range
  float input_voltage_min_v = 9;
  float input_voltage_max_v = 10;

  // Array of antenna UUIDs included with or required by this video transmitter
  repeated string antenna_uuids = 11;
  string description = 12;
  repeated ReferenceLink reference_links = 13;
  optional string primary_display_image = 14;
  repeated Media media = 15;
}

// ---------------------------------------------------------
// RPC Requests & Responses
// ---------------------------------------------------------
message GetVideoTransmitterRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListVideoTransmittersRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListVideoTransmittersResponse {
  repeated VideoTransmitter video_transmitters = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------
// gRPC Service
// ---------------------------------------------------------
service VideoTransmitterService {
  rpc GetVideoTransmitter(GetVideoTransmitterRequest) returns (VideoTransmitter);
  rpc ListVideoTransmitters(ListVideoTransmittersRequest) returns (ListVideoTransmittersResponse);
}
