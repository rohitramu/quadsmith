syntax = "proto3";

package quadsmith;

import "quadsmith/_name.proto";
import "quadsmith/_sql.proto";
import "quadsmith/reference_link.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// Domain Model
// ---------------------------------------------------------
message Build {
  option (quadsmith.name) = {
    singular: "Build"
    plural: "Builds"
    cli: "builds"
    api: "builds"
    go: "build"
    typescript: "Build"
    sql: "builds"
  };
  option (quadsmith.sql.table_name) = "builds";

  string uuid = 1 [(quadsmith.sql.is_primary_key) = true];

  string id = 2 [(quadsmith.sql.is_unique) = true];

  string name = 3;
  string description = 4;

  // -------------------------------------------------------
  // Bill of Materials (Foreign Keys to Hardware tables)
  // -------------------------------------------------------

  // The frame used for this build
  string frame_uuid = 5 [(quadsmith.sql.references) = "frames(uuid)"];

  // The motor SKU used for this build (assumes 4x for a standard quad)
  string motor_uuid = 6 [(quadsmith.sql.references) = "motors(uuid)"];

  // The primary battery recommended/used
  string battery_uuid = 7 [(quadsmith.sql.references) = "batteries(uuid)"];

  // -------------------------------------------------------
  // Electronics & Subsystems
  // -------------------------------------------------------

  // The central Flight Controller (which may be an AIO board)
  string flight_controller_uuid = 8 [(quadsmith.sql.references) = "flight_controllers(uuid)"];

  // Array of ESC boards (e.g. one 4-in-1, or four individual ESCs)
  repeated string esc_uuids = 9;

  // Array of receivers (e.g. primary ELRS, backup crossfire)
  repeated string receiver_uuids = 10;

  // Array of antennas
  repeated string antenna_uuids = 11;

  // The propeller SKU used (assumes 4x or 8x depending on motors)
  string propeller_uuid = 12 [(quadsmith.sql.references) = "propellers(uuid)"];

  // Array of cameras (e.g. primary FPV cam, secondary action cam)
  repeated string camera_uuids = 13;

  // The Video Transmitter used for this build
  string video_transmitter_uuid = 15 [(quadsmith.sql.references) = "video_transmitters(uuid)"];
  repeated ReferenceLink reference_links = 14;
}

// ---------------------------------------------------------
// RPC Requests & Responses
// ---------------------------------------------------------
message GetBuildRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListBuildsRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListBuildsResponse {
  repeated Build builds = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------
// gRPC Service
// ---------------------------------------------------------
service BuildService {
  rpc GetBuild(GetBuildRequest) returns (Build);
  rpc ListBuilds(ListBuildsRequest) returns (ListBuildsResponse);
}
