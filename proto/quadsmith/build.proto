syntax = "proto3";

package quadsmith;

import "_common.proto";
import "_sql.proto";
import "media.proto";
import "reference_link.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// Domain Model
// ---------------------------------------------------------
message Build {
  option (quadsmith.sql.table) = {name: "builds"};
  option (quadsmith.collection_path) = "builds";
  option (quadsmith.frontend) = {
    color_code: "#3b82f6"
    default_columns: [
      "id",
      "name"
    ]
  };

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];

  string id = 2 [(quadsmith.sql.column) = {is_unique: true}];

  string name = 3;
  string description = 4;

  // -------------------------------------------------------
  // Bill of Materials (Foreign Keys to Hardware tables)
  // -------------------------------------------------------

  // The frame used for this build
  string frame_uuid = 5 [(quadsmith.sql.column) = {references: "frames(uuid)"}];

  // The motor SKU used for this build (assumes 4x for a standard quad)
  string motor_uuid = 6 [(quadsmith.sql.column) = {references: "motors(uuid)"}];

  reserved 7;
  reserved "battery_uuid";

  // -------------------------------------------------------
  // Electronics & Subsystems
  // -------------------------------------------------------

  // The central Flight Controller (which may be an AIO board)
  string flight_controller_uuid = 8 [(quadsmith.sql.column) = {references: "flight_controllers(uuid)"}];

  // Array of Electronic Speed Controller boards (e.g. one 4-in-1, or four individual ESCs)
  repeated string electronic_speed_controller_uuids = 9;

  // Array of receivers (e.g. primary ELRS, backup crossfire)
  repeated string receiver_uuids = 10;

  // Array of antennas
  repeated string antenna_uuids = 11;

  // The propeller SKU used (assumes 4x or 8x depending on motors)
  string propeller_uuid = 12 [(quadsmith.sql.column) = {references: "propellers(uuid)"}];

  // Array of cameras (e.g. primary FPV cam, secondary action cam)
  repeated string camera_uuids = 13;

  // The Video Transmitter used for this build
  string video_transmitter_uuid = 14 [(quadsmith.sql.column) = {references: "video_transmitters(uuid)"}];

  // Optional GPS Receiver for navigation and rescue return-to-home
  optional string gps_receiver_uuid = 15 [(quadsmith.sql.column) = {references: "gps_receivers(uuid)"}];
  repeated ReferenceLink reference_links = 16;
  optional string primary_display_image = 17;
  repeated Media media = 18;
}

// ---------------------------------------------------------
// RPC Requests & Responses
// ---------------------------------------------------------
message GetBuildRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListBuildsRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListBuildsResponse {
  repeated Build builds = 1;
  string next_page_token = 2;
}

message CreateBuildRequest {
  Build build = 1;
}

// ---------------------------------------------------------
// gRPC Service
// ---------------------------------------------------------
service BuildService {
  rpc GetBuild(GetBuildRequest) returns (Build);
  rpc ListBuilds(ListBuildsRequest) returns (ListBuildsResponse);
  rpc CreateBuild(CreateBuildRequest) returns (Build);
}
