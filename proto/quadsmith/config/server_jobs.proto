syntax = "proto3";

package quadsmith.config;

option go_package = "quadsmith/shared/gen/quadsmith/config;config";

// ---------------------------------------------------------
// Job Server Root Configuration
// ---------------------------------------------------------

message JobServerConfig {
  optional string environment = 1;
  optional string ops_server_url = 2;
  optional string auth_token = 3;
  repeated JobScheduleConfig schedules = 4;
}

// ---------------------------------------------------------
// Job Scheduler Subordinate Configurations
// ---------------------------------------------------------

message JobScheduleConfig {
  optional string name = 1;
  optional string procedure = 2;
  optional string interval = 3;
}
