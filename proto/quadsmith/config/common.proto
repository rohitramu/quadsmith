syntax = "proto3";

package quadsmith.config;

import "google/protobuf/duration.proto";

option go_package = "quadsmith/shared/gen/quadsmith/config;config";

// ---------------------------------------------------------
// Shared Infrastructure Configurations
// ---------------------------------------------------------

message DatabaseConfig {
  optional string url = 1;
  optional string name = 2;
  optional int32 max_connections = 3;
  optional int32 min_connections = 4;
}

message ServerConfig {
  optional int32 port = 1;
  google.protobuf.Duration read_timeout = 2;
  google.protobuf.Duration write_timeout = 3;
  google.protobuf.Duration idle_timeout = 4;
  optional int64 max_request_bytes = 5;
}
