syntax = "proto3";

package quadsmith.config;

import "google/protobuf/duration.proto";

option go_package = "quadsmith/shared/gen/quadsmith/config;config";

// ---------------------------------------------------------
// Root Application Configurations
// ---------------------------------------------------------

message ApiServerConfig {
  optional string environment = 1;
  ServerConfig server = 2;
  DatabaseConfig database = 3;
  AuthConfig auth = 4;
}

message OpsServerConfig {
  optional string environment = 1;
  ServerConfig server = 2;
  DatabaseConfig database = 3; // quadsmith_api
  DatabaseConfig internal_database = 4; // quadsmith_ops
  repeated InternalGroupConfig groups = 5;
  repeated BootstrapTokenConfig bootstrap_tokens = 6;
  JitPolicyConfig jit = 7;
  OAuthConfig oauth = 8;
}

message JobServerConfig {
  optional string environment = 1;
  optional string ops_server_url = 2;
  optional string auth_token = 3;
  repeated JobScheduleConfig schedules = 4;
}

message WebServerConfig {
  optional string environment = 1;
  ServerConfig server = 2;
  optional string static_dir = 3;
  optional string api_url = 4;
  optional string app_name = 5;
}

message CliConfig {
  optional string environment = 1;
  optional string api_url = 2;
  google.protobuf.Duration timeout = 3;
}

message OpsCliConfig {
  optional string environment = 1;
  optional string ops_server_url = 2;
  google.protobuf.Duration timeout = 3;
}

// ---------------------------------------------------------
// Job Scheduler Configuration
// ---------------------------------------------------------

message JobScheduleConfig {
  optional string name = 1;
  optional string procedure = 2;
  optional string interval = 3;
}

// ---------------------------------------------------------
// Ops Server Subordinate Configurations
// ---------------------------------------------------------

message InternalGroupConfig {
  optional string name = 1;
  optional string description = 2;
  repeated string allowed_methods = 3;
}

message BootstrapTokenConfig {
  optional string id = 1;
  optional string name = 2;
  optional string token = 3;
  optional string group_name = 4;
  optional string type = 5; // 'HUMAN' or 'ROBOT'
}

message JitPolicyConfig {
  optional bool enabled = 1;
  optional bool auto_approve = 2;
  optional int32 default_hours = 3;
  optional int32 max_hours = 4;
  repeated string sensitive_methods = 5;
}

message OAuthConfig {
  optional string provider = 1; // "github", "google", etc.
  optional string client_id = 2;
  optional string client_secret = 3;
  repeated string allowed_orgs = 4;
  optional string default_group = 5;
  repeated DeveloperMapping developer_mappings = 6;
}

message DeveloperMapping {
  optional string email = 1;
  optional string group_name = 2;
}

// ---------------------------------------------------------
// Auth & Email Subordinate Configurations
// ---------------------------------------------------------

message AuthConfig {
  optional string secret = 1;
  optional bool dev_print_otp = 2;
  optional bool secure_cookies = 3;
  optional int32 trusted_proxy_hops = 4;
  google.protobuf.Duration access_token_ttl = 5;
  google.protobuf.Duration refresh_token_ttl = 6;
  google.protobuf.Duration otp_ttl = 7;
  google.protobuf.Duration magic_link_ttl = 8;
  google.protobuf.Duration email_cooldown = 9;
  EmailConfig email = 10;
}

message EmailConfig {
  oneof delivery {
    ConsoleEmailConfig console = 1;
    SmtpConfig smtp = 2;
  }
}

message ConsoleEmailConfig {}

message SmtpConfig {
  optional string host = 1;
  optional int32 port = 2; // e.g. 587 (STARTTLS) or 465 (TLS)
  optional string username = 3;
  optional string password = 4;
  optional string from_address = 5; // e.g. "Quadsmith Auth <auth@quadsmith.net>"
  optional string reply_to = 6;
  optional bool require_tls = 7;
}

// ---------------------------------------------------------
// Shared Infrastructure Configurations
// ---------------------------------------------------------

message ServerConfig {
  optional int32 port = 1;
  google.protobuf.Duration read_timeout = 2;
  google.protobuf.Duration write_timeout = 3;
  google.protobuf.Duration idle_timeout = 4;
  optional int64 max_request_bytes = 5;
}

message DatabaseConfig {
  optional string url = 1;
  optional string name = 2;
  optional int32 max_connections = 3;
  optional int32 min_connections = 4;
}
