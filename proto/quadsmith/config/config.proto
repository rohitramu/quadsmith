syntax = "proto3";

package quadsmith.config;

import "google/protobuf/duration.proto";

option go_package = "quadsmith/shared/gen/quadsmith/config;config";

// ---------------------------------------------------------
// Shared Infrastructure Configs
// ---------------------------------------------------------

message DatabaseConfig {
  string url = 1;
  string name = 2;
  int32 max_connections = 3;
  int32 min_connections = 4;
}

message ServerConfig {
  int32 port = 1;
  string static_dir = 2;
  google.protobuf.Duration read_timeout = 3;
  google.protobuf.Duration write_timeout = 4;
  google.protobuf.Duration idle_timeout = 5;
  int64 max_request_bytes = 6;
}

message AuthConfig {
  string secret = 1;
  bool dev_print_otp = 2;
  bool secure_cookies = 3;
  int32 trusted_proxy_hops = 4;
  google.protobuf.Duration access_token_ttl = 5;
  google.protobuf.Duration refresh_token_ttl = 6;
  google.protobuf.Duration otp_ttl = 7;
  google.protobuf.Duration magic_link_ttl = 8;
  google.protobuf.Duration email_cooldown = 9;
}

// ---------------------------------------------------------
// API Server & Customer CLI Configs
// ---------------------------------------------------------

message ApiServerConfig {
  string environment = 1;
  ServerConfig server = 2;
  DatabaseConfig database = 3;
  AuthConfig auth = 4;
  repeated string cors_allowed_origins = 5;
}

message CliConfig {
  string environment = 1;
  string api_url = 2;
  google.protobuf.Duration timeout = 3;
}

// ---------------------------------------------------------
// Ops Server & Ops CLI Configs
// ---------------------------------------------------------

message InternalGroupConfig {
  string name = 1;
  string description = 2;
  repeated string allowed_methods = 3;
}

message BootstrapTokenConfig {
  string id = 1;
  string name = 2;
  string token = 3;
  string group_name = 4;
  string type = 5; // 'HUMAN' or 'ROBOT'
}

message JitPolicyConfig {
  bool enabled = 1;
  bool auto_approve = 2;
  int32 default_hours = 3;
  int32 max_hours = 4;
  repeated string sensitive_methods = 5;
}

message DeveloperMapping {
  string email = 1;
  string group_name = 2;
}

message OAuthConfig {
  string provider = 1; // "github", "google", etc.
  string client_id = 2;
  string client_secret = 3;
  string issuer_url = 4;
  repeated string allowed_orgs = 5;
  repeated string allowed_teams = 6;
  repeated string allowed_email_domains = 7;
  repeated string allowed_users = 8;
  string default_group = 9;
  repeated DeveloperMapping developer_mappings = 10;
}

message OpsServerConfig {
  string environment = 1;
  ServerConfig server = 2;
  DatabaseConfig database = 3; // quadsmith_api
  DatabaseConfig internal_database = 4; // quadsmith_ops
  repeated InternalGroupConfig groups = 5;
  repeated BootstrapTokenConfig bootstrap_tokens = 6;
  JitPolicyConfig jit = 7;
  OAuthConfig oauth = 8;
}

message OpsCliConfig {
  string environment = 1;
  string ops_server_url = 2;
  google.protobuf.Duration timeout = 3;
}

// ---------------------------------------------------------
// Job Server Config
// ---------------------------------------------------------

message JobScheduleConfig {
  string name = 1;
  string procedure = 2;
  string interval = 3;
  string payload_json = 4;
}

message JobServerConfig {
  string environment = 1;
  string ops_server_url = 2;
  string auth_token = 3;
  repeated JobScheduleConfig schedules = 4;
}
