syntax = "proto3";

package quadsmith.api;

import "quadsmith/api/media.proto";
import "quadsmith/api/reference_link.proto";
import "quadsmith/common/common.proto";
import "quadsmith/sql/sql.proto";

option go_package = "quadsmith/shared/gen/quadsmith/api;api";

// ---------------------------------------------------------
// 1. gRPC Service (Services First)
// ---------------------------------------------------------
service RadioFirmwareService {
  rpc GetRadioFirmware(GetRadioFirmwareRequest) returns (RadioFirmware);
  rpc ListRadioFirmwares(ListRadioFirmwaresRequest) returns (ListRadioFirmwaresResponse);
  rpc CreateRadioFirmware(CreateRadioFirmwareRequest) returns (RadioFirmware);
  rpc UpdateRadioFirmware(UpdateRadioFirmwareRequest) returns (RadioFirmware);
  rpc DeleteRadioFirmware(DeleteRadioFirmwareRequest) returns (DeleteRadioFirmwareResponse);
}

// ---------------------------------------------------------
// 2. RPC Requests & Responses (Callers Precede Callees)
// ---------------------------------------------------------
message CreateRadioFirmwareRequest {
  RadioFirmware radio_firmware = 1;
}

message DeleteRadioFirmwareRequest {
  string id = 1;
}

message DeleteRadioFirmwareResponse {
  bool is_archived = 1;
}

message GetRadioFirmwareRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListRadioFirmwaresRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListRadioFirmwaresResponse {
  repeated RadioFirmware radio_firmwares = 1;
  string next_page_token = 2;
}

message UpdateRadioFirmwareRequest {
  RadioFirmware radio_firmware = 1;
}

// ---------------------------------------------------------
// 3. Domain Model (Referenced by Services and Requests above)
// ---------------------------------------------------------
message RadioFirmware {
  option (quadsmith.sql.table) = {name: "radio_firmwares"};
  option (quadsmith.common.collection_path) = "components/software/radio-firmware";
  option (quadsmith.common.frontend) = {
    color_code: "#84cc16"
    default_columns: [
      "manufacturer",
      "name",
      "version",
      "supported_protocols",
      "is_open_source"
    ]
  };

  string uuid = 1 [(quadsmith.sql.column) = {
    is_primary_key: true
    references: "entities(uuid) ON DELETE CASCADE"
  }];
  string id = 2 [(quadsmith.sql.column) = {ignore: true}];
  string manufacturer = 3 [(quadsmith.sql.column) = {create_index: true}];
  string name = 4 [(quadsmith.sql.column) = {ignore: true}];
  string version = 5;
  string supported_protocols = 6;
  bool is_open_source = 7;
  string description = 8 [(quadsmith.sql.column) = {ignore: true}];
  repeated ReferenceLink reference_links = 9 [(quadsmith.sql.column) = {ignore: true}];
  optional string primary_display_image = 10 [(quadsmith.sql.column) = {ignore: true}];
  repeated Media media = 11 [(quadsmith.sql.column) = {ignore: true}];
  optional string user_uuid = 12 [(quadsmith.sql.column) = {ignore: true}];
  optional string author_username = 13 [(quadsmith.sql.column) = {ignore: true}];
}
