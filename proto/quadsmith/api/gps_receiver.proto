syntax = "proto3";

package quadsmith.api;

import "quadsmith/api/media.proto";
import "quadsmith/api/reference_link.proto";
import "quadsmith/common/common.proto";
import "quadsmith/data/data.proto";
import "quadsmith/sql/sql.proto";

option go_package = "quadsmith/shared/gen/quadsmith/api;api";

// ---------------------------------------------------------
// 1. gRPC Service (Services First)
// ---------------------------------------------------------
service GpsReceiverService {
  rpc GetGpsReceiver(GetGpsReceiverRequest) returns (GpsReceiver);
  rpc ListGpsReceivers(ListGpsReceiversRequest) returns (ListGpsReceiversResponse);
  rpc CreateGpsReceiver(CreateGpsReceiverRequest) returns (GpsReceiver);
  rpc UpdateGpsReceiver(UpdateGpsReceiverRequest) returns (GpsReceiver);
  rpc DeleteGpsReceiver(DeleteGpsReceiverRequest) returns (DeleteGpsReceiverResponse);
}

// ---------------------------------------------------------
// 2. RPC Requests & Responses (Callers Precede Callees)
// ---------------------------------------------------------
message CreateGpsReceiverRequest {
  GpsReceiver gps_receiver = 1;
}

message DeleteGpsReceiverRequest {
  string id = 1;
}

message DeleteGpsReceiverResponse {
  bool is_archived = 1;
}

message GetGpsReceiverRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListGpsReceiversRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListGpsReceiversResponse {
  repeated GpsReceiver gps_receivers = 1;
  string next_page_token = 2;
}

message UpdateGpsReceiverRequest {
  GpsReceiver gps_receiver = 1;
}

// ---------------------------------------------------------
// 3. Domain Model (Referenced by Services and Requests above)
// ---------------------------------------------------------
message GpsReceiver {
  option (quadsmith.sql.table) = {name: "gps_receivers"};
  option (quadsmith.common.collection_path) = "components/hardware/gps-receivers";
  option (quadsmith.data.export) = {
    domain: EXPORT_DOMAIN_COMPONENTS
    user_filter: "uuid IN (SELECT uuid FROM entities WHERE collection = 'gps-receivers' AND user_uuid = $1::uuid)"
  };
  option (quadsmith.common.frontend) = {
    color_code: "#10b981"
    default_columns: [
      "manufacturer",
      "name",
      "chipset",
      "compass"
    ]
  };

  string uuid = 1 [
    (quadsmith.sql.column) = {
      is_primary_key: true
      references: "entities(uuid) ON DELETE CASCADE"
    },
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];

  string id = 2 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];

  string manufacturer = 3 [
    (quadsmith.sql.column) = {create_index: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  string name = 4 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  bool is_internal_only = 5 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];

  float weight_g = 6 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];

  // GNSS chipset (e.g., "u-blox MAX-M10S", "u-blox M10", "M10050")
  string chipset = 7 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];

  // Primary communication protocol (e.g., "UBLOX", "NMEA")
  string protocol = 8 [
    (quadsmith.sql.column) = {create_index: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];

  // Integrated magnetic compass chip model (e.g., "QMC5883L", "IST8310")
  optional string compass = 9 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];

  // Minimum operating input voltage
  float input_voltage_min_v = 11 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];

  // Maximum operating input voltage
  float input_voltage_max_v = 12 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];

  string description = 13 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  repeated ReferenceLink reference_links = 14 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  optional string primary_display_image = 15 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  repeated Media media = 16 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  optional string user_uuid = 17 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];
  optional string author_username = 18 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
}
