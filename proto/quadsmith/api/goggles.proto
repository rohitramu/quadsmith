syntax = "proto3";

package quadsmith.api;

import "quadsmith/api/media.proto";
import "quadsmith/api/reference_link.proto";
import "quadsmith/common/common.proto";
import "quadsmith/sql/sql.proto";

option go_package = "quadsmith/api/gen/quadsmith/api;api";

// ---------------------------------------------------------
// Domain Model
// ---------------------------------------------------------
message Goggles {
  option (quadsmith.sql.table) = {name: "goggles"};
  option (quadsmith.common.collection_path) = "components/gear/goggles";
  option (quadsmith.common.frontend) = {
    color_code: "#d946ef"
    default_columns: [
      "manufacturer",
      "name",
      "video_protocol",
      "display_type",
      "resolution",
      "fov_deg"
    ]
  };

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  string id = 2 [(quadsmith.sql.column) = {is_unique: true}];
  string manufacturer = 3 [(quadsmith.sql.column) = {create_index: true}];
  string name = 4;
  float weight_g = 5;
  string video_protocol = 6;
  string display_type = 7;
  string resolution = 8;
  float fov_deg = 9;
  string ipd_range_mm = 10;
  string voltage_range = 11;
  bool dvr_supported = 12;
  string description = 13;
  repeated ReferenceLink reference_links = 14;
  optional string primary_display_image = 15;
  repeated Media media = 16;
}

// ---------------------------------------------------------
// RPC Requests & Responses
// ---------------------------------------------------------
message GetGogglesRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListGogglesRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListGogglesResponse {
  repeated Goggles goggles = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------
// gRPC Service
// ---------------------------------------------------------
service GogglesService {
  rpc GetGoggles(GetGogglesRequest) returns (Goggles);
  rpc ListGoggles(ListGogglesRequest) returns (ListGogglesResponse);
}
