syntax = "proto3";

package quadsmith.api;

import "quadsmith/api/media.proto";
import "quadsmith/api/reference_link.proto";
import "quadsmith/common/common.proto";
import "quadsmith/data/data.proto";
import "quadsmith/sql/sql.proto";

option go_package = "quadsmith/shared/gen/quadsmith/api;api";

// ---------------------------------------------------------
// 1. gRPC Service (Services First)
// ---------------------------------------------------------
service ElectronicSpeedControllerService {
  rpc GetElectronicSpeedController(GetElectronicSpeedControllerRequest) returns (ElectronicSpeedController);
  rpc ListElectronicSpeedControllers(ListElectronicSpeedControllersRequest) returns (ListElectronicSpeedControllersResponse);
  rpc CreateElectronicSpeedController(CreateElectronicSpeedControllerRequest) returns (ElectronicSpeedController);
  rpc UpdateElectronicSpeedController(UpdateElectronicSpeedControllerRequest) returns (ElectronicSpeedController);
  rpc DeleteElectronicSpeedController(DeleteElectronicSpeedControllerRequest) returns (DeleteElectronicSpeedControllerResponse);
}

// ---------------------------------------------------------
// 2. RPC Requests & Responses (Callers Precede Callees)
// ---------------------------------------------------------
message CreateElectronicSpeedControllerRequest {
  ElectronicSpeedController electronic_speed_controller = 1;
}

message DeleteElectronicSpeedControllerRequest {
  string id = 1;
}

message DeleteElectronicSpeedControllerResponse {
  bool is_archived = 1;
}

message GetElectronicSpeedControllerRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListElectronicSpeedControllersRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListElectronicSpeedControllersResponse {
  repeated ElectronicSpeedController electronic_speed_controllers = 1;
  string next_page_token = 2;
}

message UpdateElectronicSpeedControllerRequest {
  ElectronicSpeedController electronic_speed_controller = 1;
}

// ---------------------------------------------------------
// 3. Domain Model (Referenced by Services and Requests above)
// ---------------------------------------------------------
message ElectronicSpeedController {
  option (quadsmith.sql.table) = {name: "electronic_speed_controllers"};
  option (quadsmith.common.collection_path) = "components/hardware/electronic-speed-controllers";
  option (quadsmith.data.export) = {
    domain: EXPORT_DOMAIN_COMPONENTS
    user_filter: "uuid IN (SELECT uuid FROM entities WHERE collection = 'electronic-speed-controllers' AND user_uuid = $1::uuid)"
  };
  option (quadsmith.common.frontend) = {
    color_code: "#f97316"
    default_columns: [
      "manufacturer",
      "name",
      "motor_current_max_a",
      "max_motors",
      "firmware"
    ]
  };

  string uuid = 1 [
    (quadsmith.sql.column) = {
      is_primary_key: true
      references: "entities(uuid) ON DELETE CASCADE"
    },
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];

  string id = 2 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];

  string manufacturer = 3 [
    (quadsmith.sql.column) = {create_index: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  string name = 4 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  bool is_internal_only = 5 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];

  float weight_g = 6 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];

  // E.g., 1 for individual arm ESCs, 4 for 4-in-1 boards, 8 for X8 boards
  uint32 max_motors = 7 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];

  // Continuous and Burst amperage ratings
  float motor_current_max_a = 8 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  float motor_current_burst_a = 9 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];

  // E.g., "BLHeli_S", "BLHeli_32", "AM32", "Bluejay"
  string firmware = 10 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string description = 11 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  repeated ReferenceLink reference_links = 12 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  optional string primary_display_image = 13 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  repeated Media media = 14 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];

  // Minimum operating input voltage (volts)
  float min_voltage = 15 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];

  // Maximum operating input voltage (volts)
  float max_voltage = 16 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  optional string user_uuid = 17 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];
  optional string author_username = 18 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
}
