syntax = "proto3";

package quadsmith.api;

import "quadsmith/api/media.proto";
import "quadsmith/api/reference_link.proto";
import "quadsmith/common/common.proto";
import "quadsmith/sql/sql.proto";

option go_package = "quadsmith/api/gen/quadsmith/api;api";

// ---------------------------------------------------------
// Domain Model
// ---------------------------------------------------------
message Motor {
  // This tells the Go generator to create a 'motors' table for this message
  option (quadsmith.sql.table) = {name: "motors"};
  option (quadsmith.common.collection_path) = "components/hardware/motors";
  option (quadsmith.common.frontend) = {
    color_code: "#ef4444"
    default_columns: [
      "manufacturer",
      "name",
      "stator_diameter_mm",
      "kv"
    ]
  };

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];

  // A unique, human-readable identifier (e.g., "tmotor-f80-pro-1900kv")
  string id = 2 [(quadsmith.sql.column) = {is_unique: true}];

  string manufacturer = 3 [(quadsmith.sql.column) = {create_index: true}];
  string name = 4;

  float weight_g = 5;
  float stator_diameter_mm = 6;
  float stator_height_mm = 7;
  uint32 kv = 8 [(quadsmith.sql.column) = {create_index: true}];
  string description = 9;
  repeated ReferenceLink reference_links = 10;
  optional string primary_display_image = 11;
  repeated Media media = 12;

  // Minimum operating voltage (volts) - mandatory
  float min_voltage = 13;

  // Maximum operating voltage (volts) - mandatory
  float max_voltage = 14;

  // Maximum continuous current rating (amperes) - mandatory
  float max_current_a = 15;

  // Supported propeller mounting interfaces (e.g., ["M5"], ["1.5mm T-Mount", "1.5mm Press-Fit"], ["1mm Press-Fit"], ["0.8mm Press-Fit"])
  repeated string prop_mount_interfaces = 16;

  // Motor mounting bolt pattern (e.g., "16x16mm", "19x19mm", "12x12mm", "9x9mm", "3-hole 6.6mm")
  string mount_pattern = 17;
}

// ---------------------------------------------------------
// RPC Requests & Responses
// ---------------------------------------------------------
message GetMotorRequest {
  // Can be the UUID or the human-readable ID
  string id = 1;
  repeated string columns = 2;
}

message ListMotorsRequest {
  // A CEL query string (e.g., "weight_g < 30.0 && kv >= 2000")
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListMotorsResponse {
  repeated Motor motors = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------
// gRPC Service
// ---------------------------------------------------------
service MotorService {
  rpc GetMotor(GetMotorRequest) returns (Motor);
  rpc ListMotors(ListMotorsRequest) returns (ListMotorsResponse);
}
