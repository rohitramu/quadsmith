syntax = "proto3";

package quadsmith.api;

import "quadsmith/api/media.proto";
import "quadsmith/api/reference_link.proto";
import "quadsmith/common/common.proto";
import "quadsmith/sql/sql.proto";

option go_package = "quadsmith/api/gen/quadsmith/api;api";

// ---------------------------------------------------------
// Domain Model
// ---------------------------------------------------------
message Charger {
  option (quadsmith.sql.table) = {name: "chargers"};
  option (quadsmith.common.collection_path) = "components/gear/chargers";
  option (quadsmith.common.frontend) = {
    color_code: "#f59e0b"
    default_columns: [
      "manufacturer",
      "name",
      "channels",
      "max_charge_power_w",
      "max_charge_current_a",
      "max_cells_s"
    ]
  };

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  string id = 2 [(quadsmith.sql.column) = {is_unique: true}];
  string manufacturer = 3 [(quadsmith.sql.column) = {create_index: true}];
  string name = 4;
  float weight_g = 5;
  uint32 channels = 6;
  float max_charge_power_w = 7;
  float max_charge_current_a = 8;
  string input_voltage_range = 9;
  string supported_chemistries = 10;
  uint32 max_cells_s = 11;
  string description = 12;
  repeated ReferenceLink reference_links = 13;
  optional string primary_display_image = 14;
  repeated Media media = 15;
}

// ---------------------------------------------------------
// RPC Requests & Responses
// ---------------------------------------------------------
message GetChargerRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListChargersRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListChargersResponse {
  repeated Charger chargers = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------
// gRPC Service
// ---------------------------------------------------------
service ChargerService {
  rpc GetCharger(GetChargerRequest) returns (Charger);
  rpc ListChargers(ListChargersRequest) returns (ListChargersResponse);
}
