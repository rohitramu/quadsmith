syntax = "proto3";

package quadsmith.api;

import "quadsmith/api/media.proto";
import "quadsmith/api/reference_link.proto";
import "quadsmith/common/common.proto";
import "quadsmith/sql/sql.proto";

option go_package = "quadsmith/shared/gen/quadsmith/api;api";

// ---------------------------------------------------------
// 1. gRPC Service (Services First)
// ---------------------------------------------------------
service FcFirmwareService {
  rpc GetFcFirmware(GetFcFirmwareRequest) returns (FcFirmware);
  rpc ListFcFirmwares(ListFcFirmwaresRequest) returns (ListFcFirmwaresResponse);
  rpc CreateFcFirmware(CreateFcFirmwareRequest) returns (FcFirmware);
  rpc UpdateFcFirmware(UpdateFcFirmwareRequest) returns (FcFirmware);
  rpc DeleteFcFirmware(DeleteFcFirmwareRequest) returns (DeleteFcFirmwareResponse);
}

// ---------------------------------------------------------
// 2. RPC Requests & Responses (Callers Precede Callees)
// ---------------------------------------------------------
message CreateFcFirmwareRequest {
  FcFirmware fc_firmware = 1;
}

message DeleteFcFirmwareRequest {
  string id = 1;
}

message DeleteFcFirmwareResponse {
  bool is_archived = 1;
}

message GetFcFirmwareRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListFcFirmwaresRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListFcFirmwaresResponse {
  repeated FcFirmware fc_firmwares = 1;
  string next_page_token = 2;
}

message UpdateFcFirmwareRequest {
  FcFirmware fc_firmware = 1;
}

// ---------------------------------------------------------
// 3. Domain Model (Referenced by Services and Requests above)
// ---------------------------------------------------------
message FcFirmware {
  option (quadsmith.sql.table) = {name: "flight_controller_firmwares"};
  option (quadsmith.common.collection_path) = "components/software/fc-firmware";
  option (quadsmith.common.frontend) = {
    color_code: "#3b82f6"
    default_columns: [
      "manufacturer",
      "name",
      "version",
      "target_architectures",
      "is_open_source"
    ]
  };

  string uuid = 1 [(quadsmith.sql.column) = {
    is_primary_key: true
    references: "entities(uuid) ON DELETE CASCADE"
  }];
  string id = 2 [(quadsmith.sql.column) = {ignore: true}];
  string manufacturer = 3 [(quadsmith.sql.column) = {create_index: true}];
  string name = 4 [(quadsmith.sql.column) = {ignore: true}];
  string version = 5;
  string target_architectures = 6;
  string supported_protocols = 7;
  bool is_open_source = 8;
  string repository_url = 9;
  string description = 10 [(quadsmith.sql.column) = {ignore: true}];
  repeated ReferenceLink reference_links = 11 [(quadsmith.sql.column) = {ignore: true}];
  optional string primary_display_image = 12 [(quadsmith.sql.column) = {ignore: true}];
  repeated Media media = 13 [(quadsmith.sql.column) = {ignore: true}];
  optional string user_uuid = 14 [(quadsmith.sql.column) = {ignore: true}];
  optional string author_username = 15 [(quadsmith.sql.column) = {ignore: true}];
}
