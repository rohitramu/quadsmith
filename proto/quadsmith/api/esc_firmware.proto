syntax = "proto3";

package quadsmith.api;

import "quadsmith/api/media.proto";
import "quadsmith/api/reference_link.proto";
import "quadsmith/common/common.proto";
import "quadsmith/sql/sql.proto";

option go_package = "quadsmith/shared/gen/quadsmith/api;api";

// ---------------------------------------------------------
// 1. gRPC Service (Services First)
// ---------------------------------------------------------
service EscFirmwareService {
  rpc GetEscFirmware(GetEscFirmwareRequest) returns (EscFirmware);
  rpc ListEscFirmwares(ListEscFirmwaresRequest) returns (ListEscFirmwaresResponse);
  rpc CreateEscFirmware(CreateEscFirmwareRequest) returns (EscFirmware);
  rpc UpdateEscFirmware(UpdateEscFirmwareRequest) returns (EscFirmware);
  rpc DeleteEscFirmware(DeleteEscFirmwareRequest) returns (DeleteEscFirmwareResponse);
}

// ---------------------------------------------------------
// 2. RPC Requests & Responses (Callers Precede Callees)
// ---------------------------------------------------------
message CreateEscFirmwareRequest {
  EscFirmware esc_firmware = 1;
}

message DeleteEscFirmwareRequest {
  string id = 1;
}

message DeleteEscFirmwareResponse {
  bool is_archived = 1;
}

message GetEscFirmwareRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListEscFirmwaresRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListEscFirmwaresResponse {
  repeated EscFirmware esc_firmwares = 1;
  string next_page_token = 2;
}

message UpdateEscFirmwareRequest {
  EscFirmware esc_firmware = 1;
}

// ---------------------------------------------------------
// 3. Domain Model (Referenced by Services and Requests above)
// ---------------------------------------------------------
message EscFirmware {
  option (quadsmith.sql.table) = {name: "electronic_speed_controller_firmwares"};
  option (quadsmith.common.collection_path) = "components/software/esc-firmware";
  option (quadsmith.common.frontend) = {
    color_code: "#10b981"
    default_columns: [
      "manufacturer",
      "name",
      "version",
      "protocols",
      "is_open_source"
    ]
  };

  string uuid = 1 [(quadsmith.sql.column) = {
    is_primary_key: true
    references: "entities(uuid) ON DELETE CASCADE"
  }];
  string id = 2 [(quadsmith.sql.column) = {ignore: true}];
  string manufacturer = 3 [(quadsmith.sql.column) = {create_index: true}];
  string name = 4 [(quadsmith.sql.column) = {ignore: true}];
  string version = 5;
  string protocols = 6;
  string pwm_frequency_range = 7;
  bool is_open_source = 8;
  string description = 9 [(quadsmith.sql.column) = {ignore: true}];
  repeated ReferenceLink reference_links = 10 [(quadsmith.sql.column) = {ignore: true}];
  optional string primary_display_image = 11 [(quadsmith.sql.column) = {ignore: true}];
  repeated Media media = 12 [(quadsmith.sql.column) = {ignore: true}];
  optional string user_uuid = 13 [(quadsmith.sql.column) = {ignore: true}];
  optional string author_username = 14 [(quadsmith.sql.column) = {ignore: true}];
}
