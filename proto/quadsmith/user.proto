syntax = "proto3";

package quadsmith;

import "_common.proto";
import "_sql.proto";
import "_validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// User & Profile Models
// ---------------------------------------------------------

message User {
  option (quadsmith.sql.table) = {name: "users"};

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  // Public pilot handle (e.g. "fpv_pilot")
  //
  // ============================================================================
  // REGEX FEATURE LIMITATIONS IN PROTOBUF (RE2 ENGINE):
  // ============================================================================
  // Protobuf validation frameworks (such as protovalidate, protoc-gen-validate,
  // and Google CEL / RE2) enforce strict limitations on regular expressions:
  //
  // 1. NO LOOKAROUND ASSERTIONS:
  //    Lookahead assertions ((?=...), (?!...)) and lookbehind assertions
  //    ((?<=...), (?<!...)) are strictly forbidden by RE2. Lookarounds require
  //    arbitrary backtracking which has exponential O(2^n) worst-case time complexity,
  //    exposing servers to Regular Expression Denial of Service (ReDoS) attacks.
  //    RE2 guarantees linear O(n) execution time relative to input length.
  //
  // 2. NO BACKREFERENCES:
  //    Constructs like \1, \2 are unsupported because they make matching NP-complete.
  //
  // 3. NO POSSESSIVE QUANTIFIERS:
  //    Tokens like *+, ++, ?+, {n,m}+ are unsupported.
  //
  // Because PCRE negative lookaheads like `(?!.*quad_?smith)`, `(?!admin$)`, and
  // `(?!.*__)` cannot be compiled into an RE2 pattern in Protobuf:
  //
  // - The structural regex `pattern: "^[a-z][a-z0-9_]{1,18}[a-z0-9]$"` validates:
  //   * Starts with a lowercase letter [a-z]
  //   * Contains only lowercase letters, digits, and underscores
  //   * Ends with an alphanumeric character [a-z0-9] (no trailing underscore)
  //   * Length between 3 and 20 characters
  //
  // - Exact-match exclusions are declared via `not_in: ["admin", "root"]`.
  //
  // - Substring and consecutive symbol exclusions are declared via
  //   `not_contains: ["__", "quadsmith", "quad_smith"]`.
  // ============================================================================
  string id = 2 [
    (quadsmith.sql.column) = {
      is_unique: true
      create_index: true
    },
    (quadsmith.validate.rules).string = {
      min_len: 3
      max_len: 20
      pattern: "^[a-z][a-z0-9_]{1,18}[a-z0-9]$"
      not_in: [
        "admin",
        "root"
      ]
      not_contains: [
        "__",
        "quadsmith",
        "quad_smith"
      ]
    }
  ];
  string email = 3 [(quadsmith.sql.column) = {
    is_unique: true
    create_index: true
  }]; // Verified email (private)
  string role = 4 [(quadsmith.sql.column) = {default_value: "'USER'"}]; // "USER", "ADMIN"

  google.protobuf.Timestamp email_verified_at = 5;
  google.protobuf.Timestamp last_renamed_at = 6;
  google.protobuf.Timestamp deleted_at = 7;
  google.protobuf.Timestamp banned_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message UserProfile {
  option (quadsmith.sql.table) = {name: "user_profiles"};

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  string user_uuid = 2 [(quadsmith.sql.column) = {
    references: "users(uuid)"
    is_unique: true
    create_index: true
  }];
  string display_name = 3;
  string avatar_url = 4;
  string bio = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message UserEmail {
  option (quadsmith.sql.table) = {name: "user_emails"};

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  string user_uuid = 2 [(quadsmith.sql.column) = {
    references: "users(uuid)"
    create_index: true
  }];
  string email = 3 [(quadsmith.sql.column) = {
    is_unique: true
    create_index: true
  }];
  bool is_primary = 4 [(quadsmith.sql.column) = {default_value: "false"}];
  google.protobuf.Timestamp verified_at = 5;
  google.protobuf.Timestamp created_at = 6;
}

message PublicUserProfile {
  string id = 1; // Public pilot handle (or UUID fallback)
  string display_name = 2;
  string avatar_url = 3;
  string bio = 4;
  google.protobuf.Timestamp created_at = 5;
  int32 build_count = 6;
}

message RefreshToken {
  option (quadsmith.sql.table) = {name: "refresh_tokens"};

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  string user_uuid = 2 [(quadsmith.sql.column) = {
    references: "users(uuid)"
    create_index: true
  }];
  string token_hash = 3 [(quadsmith.sql.column) = {
    is_unique: true
    create_index: true
  }];
  google.protobuf.Timestamp expires_at = 4;
  google.protobuf.Timestamp last_used_at = 5;
  string device_hint = 6;
  google.protobuf.Timestamp created_at = 7;
}

message EmailOtp {
  option (quadsmith.sql.table) = {name: "email_otps"};

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  string email = 2 [(quadsmith.sql.column) = {create_index: true}];
  string code_hash = 3;
  google.protobuf.Timestamp expires_at = 4;
  google.protobuf.Timestamp used_at = 5;
  int32 failed_attempts = 6 [(quadsmith.sql.column) = {default_value: "0"}];
  google.protobuf.Timestamp created_at = 7;
}

message HandleHistory {
  option (quadsmith.sql.table) = {name: "handle_histories"};

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  string user_uuid = 2 [(quadsmith.sql.column) = {
    references: "users(uuid)"
    create_index: true
  }];
  string old_handle = 3 [(quadsmith.sql.column) = {create_index: true}];
  google.protobuf.Timestamp renamed_at = 4;
}

message OAuthAccount {
  option (quadsmith.sql.table) = {name: "oauth_accounts"};

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  string user_uuid = 2 [(quadsmith.sql.column) = {
    references: "users(uuid)"
    create_index: true
  }];
  string provider = 3; // "google", "github"
  string provider_account_id = 4;
  string access_token = 5;
  string refresh_token = 6;
  google.protobuf.Timestamp token_expires_at = 7;
  google.protobuf.Timestamp created_at = 8;
}

// ---------------------------------------------------------
// User Service
// ---------------------------------------------------------

message GetUserRequest {
  string id = 1; // Can be handle or UUID
}

message GetPublicProfileRequest {
  string id = 1; // Can be handle or UUID
}

message CheckHandleAvailableRequest {
  string handle = 1 [(quadsmith.validate.rules).string = {
    min_len: 3
    max_len: 20
    pattern: "^[a-z][a-z0-9_]{1,18}[a-z0-9]$"
    not_in: [
      "admin",
      "root"
    ]
    not_contains: [
      "__",
      "quadsmith",
      "quad_smith"
    ]
  }];
}

message CheckHandleAvailableResponse {
  bool available = 1;
  string message = 2;
}

service UserService {
  rpc GetUser(GetUserRequest) returns (User);
  rpc GetPublicProfile(GetPublicProfileRequest) returns (PublicUserProfile);
  rpc CheckHandleAvailable(CheckHandleAvailableRequest) returns (CheckHandleAvailableResponse);
}
