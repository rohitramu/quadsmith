syntax = "proto3";

package quadsmith;

import "_common.proto";
import "_sql.proto";
import "_validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// User & Profile Models
// ---------------------------------------------------------

message User {
  option (quadsmith.sql.table) = {name: "users"};

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  // Public username (e.g. "fpv_pilot")
  // Enforces username constraints via declarative rules defined in _validate.proto:
  // - Starts with [a-z], ends with [a-z0-9], allows [a-z0-9_], length 3-20.
  // - Rejects reserved handles ("admin", "root", "system", "bot", "robot") via `not_in`.
  // - Rejects consecutive underscores ("__") and reserved brands ("quadsmith", "quad_smith") via `not_contains`.
  // (See `_validate.proto` for comprehensive documentation on RE2 regex restrictions and ReDoS guarantees).
  string id = 2 [
    (quadsmith.sql.column) = {
      is_unique: true
      create_index: true
    },
    (quadsmith.validate.rules).string = {
      min_len: 3
      max_len: 20
      pattern: "^[a-z][a-z0-9_]{1,18}[a-z0-9]$"
      not_in: [
        "admin",
        "root",
        "system",
        "bot",
        "robot"
      ]
      not_contains: [
        "__",
        "quadsmith",
        "quad_smith"
      ]
    }
  ];
  string email = 3 [(quadsmith.sql.column) = {
    is_unique: true
    create_index: true
  }]; // Verified email (private)
  string role = 4 [(quadsmith.sql.column) = {default_value: "'USER'"}]; // "USER", "ADMIN"

  google.protobuf.Timestamp last_renamed_at = 5;
  google.protobuf.Timestamp deleted_at = 6;
  google.protobuf.Timestamp banned_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message UserProfile {
  option (quadsmith.sql.table) = {name: "user_profiles"};

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  string user_uuid = 2 [(quadsmith.sql.column) = {
    references: "users(uuid)"
    is_unique: true
    create_index: true
  }];
  string avatar_url = 3;
  string bio = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message UserEmail {
  option (quadsmith.sql.table) = {name: "user_emails"};

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  string user_uuid = 2 [(quadsmith.sql.column) = {
    references: "users(uuid)"
    create_index: true
  }];
  string email = 3 [(quadsmith.sql.column) = {
    is_unique: true
    create_index: true
  }];
  bool is_primary = 4 [(quadsmith.sql.column) = {default_value: "false"}];
  google.protobuf.Timestamp created_at = 5;
}

message PublicUserProfile {
  string id = 1; // Public username (or UUID fallback)
  string avatar_url = 2;
  string bio = 3;
  google.protobuf.Timestamp created_at = 4;
  int32 build_count = 5;
  int32 reputation_score = 6;
}

message RefreshToken {
  option (quadsmith.sql.table) = {name: "refresh_tokens"};

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  string user_uuid = 2 [(quadsmith.sql.column) = {
    references: "users(uuid)"
    create_index: true
  }];
  string token_hash = 3 [(quadsmith.sql.column) = {
    is_unique: true
    create_index: true
  }];
  google.protobuf.Timestamp expires_at = 4;
  google.protobuf.Timestamp last_used_at = 5;
  string device_hint = 6;
  google.protobuf.Timestamp created_at = 7;
}

message EmailOtp {
  option (quadsmith.sql.table) = {name: "email_otps"};

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  string email = 2 [(quadsmith.sql.column) = {create_index: true}];
  string code_hash = 3;
  google.protobuf.Timestamp expires_at = 4;
  google.protobuf.Timestamp used_at = 5;
  int32 failed_attempts = 6 [(quadsmith.sql.column) = {default_value: "0"}];
  google.protobuf.Timestamp created_at = 7;
  string challenge_id_hash = 8 [(quadsmith.sql.column) = {
    create_index: true
    default_value: "''"
  }];
  string purpose = 9 [(quadsmith.sql.column) = {default_value: "'login'"}];
  optional string requested_by_user_uuid = 10 [(quadsmith.sql.column) = {references: "users(uuid)"}];
}

message UsernameHistory {
  option (quadsmith.sql.table) = {name: "username_histories"};

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  string user_uuid = 2 [(quadsmith.sql.column) = {
    references: "users(uuid)"
    create_index: true
  }];
  string old_username = 3 [(quadsmith.sql.column) = {create_index: true}];
  google.protobuf.Timestamp renamed_at = 4;
  google.protobuf.Timestamp first_archived_at = 5 [(quadsmith.sql.column) = {
    default_value: "NOW()"
    create_index: true
  }];
  google.protobuf.Timestamp release_warning_sent_at = 6;
}

message OAuthAccount {
  option (quadsmith.sql.table) = {name: "oauth_accounts"};

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  string user_uuid = 2 [(quadsmith.sql.column) = {
    references: "users(uuid)"
    create_index: true
  }];
  string provider = 3; // "google", "github"
  string provider_account_id = 4;
  string access_token = 5;
  string refresh_token = 6;
  google.protobuf.Timestamp token_expires_at = 7;
  google.protobuf.Timestamp created_at = 8;
}

// ---------------------------------------------------------
// User Service
// ---------------------------------------------------------

message GetUserRequest {
  string id = 1; // Can be username or UUID
}

message GetPublicProfileRequest {
  string id = 1; // Can be username or UUID
}

enum UsernameAvailabilityStatus {
  USERNAME_AVAILABILITY_STATUS_UNSPECIFIED = 0;
  USERNAME_AVAILABILITY_STATUS_AVAILABLE = 1;
  USERNAME_AVAILABILITY_STATUS_UNAVAILABLE = 2;
  USERNAME_AVAILABILITY_STATUS_INVALID = 3;
}

message CheckUsernameAvailableRequest {
  string username = 1;
}

message CheckUsernameAvailableResponse {
  UsernameAvailabilityStatus status = 1;
  bool available = 2;
  string message = 3;
}

message SeedUser {
  string uuid = 1;
  string id = 2;
  string email = 3;
  string role = 4;
  string bio = 5;
  int32 reputation_score = 6;
}

message ListUsersResponse {
  repeated SeedUser users = 1;
  string next_page_token = 2;
}

service UserService {
  rpc GetUser(GetUserRequest) returns (User);
  rpc GetPublicProfile(GetPublicProfileRequest) returns (PublicUserProfile);
  rpc CheckUsernameAvailable(CheckUsernameAvailableRequest) returns (CheckUsernameAvailableResponse);
}
