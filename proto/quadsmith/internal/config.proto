syntax = "proto3";

package quadsmith.internal;

import "google/protobuf/duration.proto";

option go_package = "quadsmith/api/gen/quadsmith_internal;quadsmith_internal";

message DatabaseConfig {
  string url = 1;
  string name = 2;
  int32 max_connections = 3;
  int32 min_connections = 4;
}

message ServerConfig {
  int32 port = 1;
  string static_dir = 2;
  google.protobuf.Duration read_timeout = 3;
  google.protobuf.Duration write_timeout = 4;
  google.protobuf.Duration idle_timeout = 5;
  int64 max_request_bytes = 6;
}

message AuthConfig {
  string secret = 1;
  bool dev_print_otp = 2;
  bool secure_cookies = 3;
  int32 trusted_proxy_hops = 4;
  google.protobuf.Duration access_token_ttl = 5;
  google.protobuf.Duration refresh_token_ttl = 6;
  google.protobuf.Duration otp_ttl = 7;
  google.protobuf.Duration magic_link_ttl = 8;
  google.protobuf.Duration email_cooldown = 9;
}

message WorkerDaemonConfig {
  int32 port = 1;
  int32 concurrency = 2;
}

message ApiServerConfig {
  string environment = 1;
  ServerConfig server = 2;
  DatabaseConfig database = 3;
  AuthConfig auth = 4;
}

message WorkerConfig {
  string environment = 1;
  WorkerDaemonConfig worker = 2;
  DatabaseConfig database = 3;
  DatabaseConfig internal_database = 4;
}
