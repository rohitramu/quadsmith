syntax = "proto3";

package quadsmith.internal;

import "_sql.proto";
import "google/protobuf/timestamp.proto";

option go_package = "quadsmith/api/gen/quadsmith_internal;quadsmith_internal";

// ---------------------------------------------------------
// Job Status Enums
// ---------------------------------------------------------

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_PENDING = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_COMPLETED = 3;
  JOB_STATUS_FAILED = 4;
  JOB_STATUS_CANCELLED = 5;
}

enum AttemptStatus {
  ATTEMPT_STATUS_UNSPECIFIED = 0;
  ATTEMPT_STATUS_RUNNING = 1;
  ATTEMPT_STATUS_COMPLETED = 2;
  ATTEMPT_STATUS_FAILED = 3;
}

// ---------------------------------------------------------
// Database Models (Generated by protoc-gen-sql)
// ---------------------------------------------------------

message BackgroundJobRecord {
  option (quadsmith.sql.table) = {name: "background_jobs"};

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  string job_type = 2 [(quadsmith.sql.column) = {create_index: true}];
  string payload = 3 [(quadsmith.sql.column) = {
    column_type: "JSONB"
    default_value: "'{}'"
  }];
  string status = 4 [(quadsmith.sql.column) = {
    create_index: true
    default_value: "'pending'"
  }];
  optional string unique_key = 5;
  int32 max_attempts = 6 [(quadsmith.sql.column) = {default_value: "3"}];
  google.protobuf.Timestamp scheduled_at = 7 [(quadsmith.sql.column) = {
    create_index: true
    default_value: "NOW()"
  }];
  google.protobuf.Timestamp created_at = 8 [(quadsmith.sql.column) = {default_value: "NOW()"}];
  google.protobuf.Timestamp updated_at = 9 [(quadsmith.sql.column) = {default_value: "NOW()"}];
}

message BackgroundJobAttemptRecord {
  option (quadsmith.sql.table) = {name: "background_job_attempts"};

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  string job_uuid = 2 [(quadsmith.sql.column) = {
    references: "background_jobs(uuid) ON DELETE CASCADE"
    create_index: true
  }];
  int32 attempt_number = 3;
  string worker_id = 4;
  google.protobuf.Timestamp started_at = 5 [(quadsmith.sql.column) = {default_value: "NOW()"}];
  google.protobuf.Timestamp completed_at = 6;
  string status = 7 [(quadsmith.sql.column) = {default_value: "'running'"}];
  optional string error_message = 8;
}

// ---------------------------------------------------------
// Worker Service Messages
// ---------------------------------------------------------

message BackgroundJobAttempt {
  string uuid = 1;
  string job_uuid = 2;
  int32 attempt_number = 3;
  string worker_id = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp completed_at = 6;
  AttemptStatus status = 7;
  string error_message = 8;
}

message BackgroundJob {
  string uuid = 1;
  string job_type = 2;
  string payload_json = 3;
  JobStatus status = 4;
  string unique_key = 5;
  int32 max_attempts = 6;
  google.protobuf.Timestamp scheduled_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  repeated BackgroundJobAttempt attempts = 10;
}

message ListJobsRequest {
  JobStatus status_filter = 1;
  int32 limit = 2;
}

message ListJobsResponse {
  repeated BackgroundJob jobs = 1;
}

message GetJobRequest {
  string job_uuid = 1;
}

message GetJobResponse {
  BackgroundJob job = 1;
}

message TriggerJobRequest {
  string job_type = 1;
  string payload_json = 2;
  string unique_key = 3;
}

message TriggerJobResponse {
  string job_uuid = 1;
}

message RetryJobRequest {
  string job_uuid = 1;
}

message RetryJobResponse {
  bool success = 1;
}

message GetWorkerStatusRequest {}

message GetWorkerStatusResponse {
  bool is_healthy = 1;
  int32 pending_jobs = 2;
  int32 running_jobs = 3;
  int32 failed_jobs = 4;
  repeated string registered_tasks = 5;
}

// ---------------------------------------------------------
// Worker Service
// ---------------------------------------------------------

service WorkerService {
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc TriggerJob(TriggerJobRequest) returns (TriggerJobResponse);
  rpc RetryJob(RetryJobRequest) returns (RetryJobResponse);
  rpc GetWorkerStatus(GetWorkerStatusRequest) returns (GetWorkerStatusResponse);
}
