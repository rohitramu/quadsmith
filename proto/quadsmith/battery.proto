syntax = "proto3";

package quadsmith;

import "_common.proto";
import "_sql.proto";
import "media.proto";
import "reference_link.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// Domain Model
// ---------------------------------------------------------
message Battery {
  option (quadsmith.name) = {
    singular: "Battery"
    plural: "Batteries"
  };
  option (quadsmith.sql.table) = {name: "batteries"};
  option (quadsmith.frontend) = {
    default_columns: [
      "manufacturer",
      "name",
      "cell_count_s",
      "capacity_mah"
    ]
  };

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];

  string id = 2 [(quadsmith.sql.column) = {is_unique: true}];

  string manufacturer = 3 [(quadsmith.sql.column) = {create_index: true}];
  string name = 4;

  float weight_g = 5;

  // Total capacity in milliampere-hours (e.g., 1100, 1300)
  uint32 capacity_mah = 6;

  // Number of cells in series (e.g., 4 for 4S, 6 for 6S)
  uint32 cell_count_s = 7 [(quadsmith.sql.column) = {create_index: true}];

  // E.g., "LiPo", "LiHV", "Li-ion"
  string chemistry = 8;

  // E.g., "XT60", "XT30", "BT2.0"
  string connector = 9;
  string description = 10;
  repeated ReferenceLink reference_links = 11;
  optional string primary_display_image = 12;
  repeated Media media = 13;

  // Minimum operating / cutoff voltage (volts)
  float min_voltage = 14;

  // Maximum fully charged voltage (volts)
  float max_voltage = 15;

  // Maximum continuous discharge current rating (amperes)
  float max_current_a = 16;
}

// ---------------------------------------------------------
// RPC Requests & Responses
// ---------------------------------------------------------
message GetBatteryRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListBatteriesRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListBatteriesResponse {
  repeated Battery batteries = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------
// gRPC Service
// ---------------------------------------------------------
service BatteryService {
  rpc GetBattery(GetBatteryRequest) returns (Battery);
  rpc ListBatteries(ListBatteriesRequest) returns (ListBatteriesResponse);
}
