syntax = "proto3";

package quadsmith;

import "_common.proto";
import "_sql.proto";
import "media.proto";
import "reference_link.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// Domain Model
// ---------------------------------------------------------
message VtxFirmware {
  option (quadsmith.sql.table) = {name: "video_transmitter_firmwares"};
  option (quadsmith.collection_path) = "components/software/vtx-firmware";
  option (quadsmith.frontend) = {
    color_code: "#ec4899"
    default_columns: [
      "manufacturer",
      "name",
      "version",
      "protocol",
      "supported_resolutions"
    ]
  };

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];
  string id = 2 [(quadsmith.sql.column) = {is_unique: true}];
  string manufacturer = 3 [(quadsmith.sql.column) = {create_index: true}];
  string name = 4;
  string version = 5;
  string protocol = 6;
  string supported_resolutions = 7;
  string description = 8;
  repeated ReferenceLink reference_links = 9;
  optional string primary_display_image = 10;
  repeated Media media = 11;
}

// ---------------------------------------------------------
// RPC Requests & Responses
// ---------------------------------------------------------
message GetVtxFirmwareRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListVtxFirmwaresRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListVtxFirmwaresResponse {
  repeated VtxFirmware vtx_firmwares = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------
// gRPC Service
// ---------------------------------------------------------
service VtxFirmwareService {
  rpc GetVtxFirmware(GetVtxFirmwareRequest) returns (VtxFirmware);
  rpc ListVtxFirmwares(ListVtxFirmwaresRequest) returns (ListVtxFirmwaresResponse);
}
