syntax = "proto3";

package quadsmith;

import "_common.proto";
import "_sql.proto";
import "media.proto";
import "reference_link.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// Domain Model
// ---------------------------------------------------------
message Propeller {
  option (quadsmith.name) = {
    singular: "Propeller"
    plural: "Propellers"
  };
  option (quadsmith.sql.table) = {name: "propellers"};
  option (quadsmith.collection_path) = "components/hardware/propellers";
  option (quadsmith.frontend) = {
    default_columns: [
      "manufacturer",
      "name",
      "diameter_mm",
      "pitch_mm",
      "blades"
    ]
  };

  string uuid = 1 [(quadsmith.sql.column) = {is_primary_key: true}];

  string id = 2 [(quadsmith.sql.column) = {is_unique: true}];

  string manufacturer = 3 [(quadsmith.sql.column) = {create_index: true}];
  string name = 4;

  float weight_g = 5;

  // E.g., 5.1, 7.0, 3.0
  float diameter_mm = 6;

  // E.g., 4.3, 3.1
  float pitch_mm = 7;

  // Number of blades (e.g., 2, 3, 4)
  uint32 blades = 8;

  // E.g., "Polycarbonate", "Carbon Fiber"
  string material = 9;
  string description = 10;
  repeated ReferenceLink reference_links = 11;
  optional string primary_display_image = 12;
  repeated Media media = 13;
}

// ---------------------------------------------------------
// RPC Requests & Responses
// ---------------------------------------------------------
message GetPropellerRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListPropellersRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListPropellersResponse {
  repeated Propeller propellers = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------
// gRPC Service
// ---------------------------------------------------------
service PropellerService {
  rpc GetPropeller(GetPropellerRequest) returns (Propeller);
  rpc ListPropellers(ListPropellersRequest) returns (ListPropellersResponse);
}
