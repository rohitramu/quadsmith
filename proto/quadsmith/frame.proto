syntax = "proto3";

package quadsmith;

import "quadsmith/_common.proto";
import "quadsmith/_sql.proto";
import "quadsmith/reference_link.proto";

option go_package = "quadsmith/api/gen/quadsmith";

// ---------------------------------------------------------
// Domain Model
// ---------------------------------------------------------
message Frame {
  option (quadsmith.sql.table_name) = "frames";
  option (quadsmith.default_columns) = "manufacturer";
  option (quadsmith.default_columns) = "name";
  option (quadsmith.default_columns) = "wheelbase_mm";
  option (quadsmith.default_columns) = "geometry";

  string uuid = 1 [(quadsmith.sql.is_primary_key) = true];

  string id = 2 [(quadsmith.sql.is_unique) = true];

  string manufacturer = 3 [(quadsmith.sql.create_index) = true];
  string name = 4;

  float weight_g = 5;

  // The diagonal distance between motors in millimeters
  float wheelbase_mm = 6;

  // Maximum propeller size supported
  float max_prop_size_mm = 7;

  // E.g., "True X", "Squashed X", "Deadcat"
  string geometry = 8;
  string description = 9;
  repeated ReferenceLink reference_links = 10;
}

// ---------------------------------------------------------
// RPC Requests & Responses
// ---------------------------------------------------------
message GetFrameRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListFramesRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListFramesResponse {
  repeated Frame frames = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------
// gRPC Service
// ---------------------------------------------------------
service FrameService {
  rpc GetFrame(GetFrameRequest) returns (Frame);
  rpc ListFrames(ListFramesRequest) returns (ListFramesResponse);
}
