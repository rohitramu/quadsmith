services:
  db:
    build:
      context: ..
      dockerfile: test/Dockerfile.db
    ports:
      - "${DB_PORT:-5432}:5432"
      - "${PORT:-8080}:8080"
      - "${OPS_PORT:-8081}:8081"
      - "${WEB_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quadsmith_api"]
      interval: 100ms
      timeout: 1s
      retries: 50
      start_period: 200ms

  api:
    build:
      context: ..
      dockerfile: src/go/server-api/Dockerfile
    network_mode: "service:db"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz || exit 1"]
      interval: 100ms
      timeout: 1s
      retries: 50
      start_period: 200ms
    entrypoint: ["/app/server-api", "--config", "/app/src/go/server-api/config/sandbox.textproto"]

  ops:
    build:
      context: ..
      dockerfile: src/go/server-ops/Dockerfile
    network_mode: "service:db"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/healthz || exit 1"]
      interval: 100ms
      timeout: 1s
      retries: 50
      start_period: 200ms
    entrypoint: ["/app/server-ops", "--config", "/app/src/go/server-ops/config/sandbox.textproto"]

  jobs:
    build:
      context: ..
      dockerfile: src/go/server-jobs/Dockerfile
    network_mode: "service:db"
    depends_on:
      ops:
        condition: service_healthy
    entrypoint: ["/app/server-jobs", "--config", "/app/src/go/server-jobs/config/sandbox.textproto"]

  web:
    build:
      context: ..
      dockerfile: src/go/server-web/Dockerfile
    network_mode: "service:db"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/healthz || exit 1"]
      interval: 100ms
      timeout: 1s
      retries: 50
      start_period: 200ms
    entrypoint: ["/app/server-web", "--config", "/app/src/go/server-web/config/sandbox.textproto"]
