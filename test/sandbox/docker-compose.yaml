services:
  db:
    build:
      context: ../..
      dockerfile: test/sandbox/db/Dockerfile
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quadsmith_api"]
      interval: 100ms
      timeout: 1s
      retries: 50
      start_period: 200ms

  api:
    build:
      context: ../..
      dockerfile: src/go/server-api/Dockerfile
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      - QS_DATABASE_URL=postgres://postgres:postgres@db:5432/quadsmith_api?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz || exit 1"]
      interval: 100ms
      timeout: 1s
      retries: 50
      start_period: 200ms
    entrypoint: ["/app/server-api", "--config", "/app/src/go/server-api/config/sandbox.textproto"]

  ops:
    build:
      context: ../..
      dockerfile: src/go/server-ops/Dockerfile
    ports:
      - "${OPS_PORT:-8082}:8080"
    environment:
      - QS_DATABASE_URL=postgres://postgres:postgres@db:5432/quadsmith_api?sslmode=disable
      - QS_INTERNAL_DATABASE_URL=postgres://postgres:postgres@db:5432/quadsmith_ops?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz || exit 1"]
      interval: 100ms
      timeout: 1s
      retries: 50
      start_period: 200ms
    entrypoint: ["/app/server-ops", "--config", "/app/src/go/server-ops/config/sandbox.textproto"]

  jobs:
    build:
      context: ../..
      dockerfile: src/go/server-jobs/Dockerfile
    environment:
      - QS_OPS_SERVER_URL=http://ops:8080
    depends_on:
      ops:
        condition: service_healthy
    entrypoint: ["/app/server-jobs", "--config", "/app/src/go/server-jobs/config/sandbox.textproto"]

  web:
    build:
      context: ../..
      dockerfile: src/go/server-web/Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - QS_API_URL=http://api:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz || exit 1"]
      interval: 100ms
      timeout: 1s
      retries: 50
      start_period: 200ms
    entrypoint: ["/app/server-web", "--config", "/app/src/go/server-web/config/sandbox.textproto"]
