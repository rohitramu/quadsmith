server:
  port: 443
  static_dir: "/app/web/dist"
  read_timeout: 30s
  write_timeout: 60s
  idle_timeout: 120s
  max_request_bytes: 2097152

database:
  url: "${QS_DATABASE_URL}" # Injected via environment
  max_connections: 25
  min_connections: 2

auth:
  secret: "${QS_AUTH_SECRET}" # Injected via environment
  dev_print_otp: false
  secure_cookies: true
  trusted_proxy_hops: 1
  access_token_ttl: 1h
  refresh_token_ttl: 120h
  otp_ttl: 3m
  magic_link_ttl: 15m
  email_cooldown: 20s
