server:
  port: 8080
  static_dir: "/app/web/dist"
  read_timeout: 30s
  write_timeout: 60s
  idle_timeout: 120s
  max_request_bytes: 2097152 # 2MB

database:
  url: "${QS_DATABASE_URL:-postgres://postgres:postgres@127.0.0.1:5432/quadsmith?sslmode=disable}"
  max_connections: 25
  min_connections: 2

auth:
  secret: "${QS_AUTH_SECRET:-quadsmith-dev-secret-key-32bytes-long!}"
  dev_print_otp: true
  secure_cookies: false
  trusted_proxy_hops: 0
  access_token_ttl: 1h
  refresh_token_ttl: 120h
  otp_ttl: 3m
  magic_link_ttl: 15m
  email_cooldown: 20s
