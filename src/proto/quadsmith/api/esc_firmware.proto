syntax = "proto3";

package quadsmith.api;

import "quadsmith/api/media.proto";
import "quadsmith/api/reference_link.proto";
import "quadsmith/common/common.proto";
import "quadsmith/data/data.proto";
import "quadsmith/sql/sql.proto";

option go_package = "quadsmith/shared/gen/quadsmith/api;api";

// ---------------------------------------------------------
// Services
// ---------------------------------------------------------

service EscFirmwareService {
  rpc GetEscFirmware(GetEscFirmwareRequest) returns (EscFirmware);
  rpc ListEscFirmwares(ListEscFirmwaresRequest) returns (ListEscFirmwaresResponse);
  rpc CreateEscFirmware(CreateEscFirmwareRequest) returns (EscFirmware);
  rpc UpdateEscFirmware(UpdateEscFirmwareRequest) returns (EscFirmware);
  rpc DeleteEscFirmware(DeleteEscFirmwareRequest) returns (DeleteEscFirmwareResponse);
}

// ---------------------------------------------------------
// Domain model
// ---------------------------------------------------------

message EscFirmware {
  option (quadsmith.sql.table) = {
    name: "electronic_speed_controller_firmwares"
    inherits: "entities"
  };
  option (quadsmith.common.collection_path) = "components/software/esc-firmware";
  option (quadsmith.data.export) = {
    domain: EXPORT_DOMAIN_COMPONENTS
    user_filter: "uuid IN (SELECT uuid FROM entities WHERE collection = 'esc-firmware' AND user_uuid = $1::uuid)"
  };
  option (quadsmith.common.frontend) = {
    default_columns: [
      "manufacturer",
      "name",
      "version",
      "protocols",
      "is_open_source"
    ]
  };

  string uuid = 1 [
    (quadsmith.sql.column) = {
      is_primary_key: true
      references: "entities(uuid) ON DELETE CASCADE"
    },
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];
  string id = 2 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  string manufacturer = 3 [
    (quadsmith.sql.column) = {create_index: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  string name = 4 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string version = 5 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string protocols = 6 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string pwm_frequency_range = 7 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  bool is_open_source = 8 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string description = 9 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  repeated ReferenceLink reference_links = 10 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  optional string primary_display_image = 11 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  repeated Media media = 12 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  optional string user_uuid = 13 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  optional string author_username = 14 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
}

// ---------------------------------------------------------
// Request/response messages
// ---------------------------------------------------------

message CreateEscFirmwareRequest {
  EscFirmware esc_firmware = 1;
}

message DeleteEscFirmwareRequest {
  string id = 1;
}

message DeleteEscFirmwareResponse {
  bool is_archived = 1;
}

message GetEscFirmwareRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListEscFirmwaresRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListEscFirmwaresResponse {
  repeated EscFirmware esc_firmwares = 1;
  string next_page_token = 2;
}

message UpdateEscFirmwareRequest {
  EscFirmware esc_firmware = 1;
}
