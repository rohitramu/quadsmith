syntax = "proto3";

package quadsmith.api;

import "google/protobuf/timestamp.proto";

option go_package = "quadsmith/shared/gen/quadsmith/api;api";

// ---------------------------------------------------------
// Services
// ---------------------------------------------------------

service SocialService {
  // Reviews
  rpc CreateReview(CreateReviewRequest) returns (Review);
  rpc UpdateReview(UpdateReviewRequest) returns (Review);
  rpc DeleteReview(DeleteReviewRequest) returns (ReviewSummary);
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse);
  rpc VoteReview(VoteReviewRequest) returns (VoteReviewResponse);
  rpc CreateReviewComment(CreateReviewCommentRequest) returns (ReviewComment);
  rpc DeleteReviewComment(DeleteReviewCommentRequest) returns (ReviewComment);
  rpc ListReviewComments(ListReviewCommentsRequest) returns (ListReviewCommentsResponse);

  // Technical Q&A
  rpc CreateQuestion(CreateQuestionRequest) returns (Question);
  rpc UpdateQuestion(UpdateQuestionRequest) returns (Question);
  rpc DeleteQuestion(DeleteQuestionRequest) returns (Question);
  rpc ListQuestions(ListQuestionsRequest) returns (ListQuestionsResponse);
  rpc VoteQuestion(VoteQuestionRequest) returns (VoteQuestionResponse);
  rpc CreateAnswer(CreateAnswerRequest) returns (Answer);
  rpc UpdateAnswer(UpdateAnswerRequest) returns (Answer);
  rpc DeleteAnswer(DeleteAnswerRequest) returns (Answer);
  rpc ListAnswers(ListAnswersRequest) returns (ListAnswersResponse);
  rpc VoteAnswer(VoteAnswerRequest) returns (VoteAnswerResponse);
  rpc AcceptAnswer(AcceptAnswerRequest) returns (Answer);
  rpc EndorseAnswer(EndorseAnswerRequest) returns (Answer);
  rpc CreateQuestionComment(CreateQuestionCommentRequest) returns (QuestionComment);
  rpc DeleteQuestionComment(DeleteQuestionCommentRequest) returns (QuestionComment);
  rpc CreateAnswerComment(CreateAnswerCommentRequest) returns (AnswerComment);
  rpc DeleteAnswerComment(DeleteAnswerCommentRequest) returns (AnswerComment);

  // Collections & Likes
  rpc CreateCollection(CreateCollectionRequest) returns (Collection);
  rpc UpdateCollection(UpdateCollectionRequest) returns (Collection);
  rpc DeleteCollection(DeleteCollectionRequest) returns (Collection);
  rpc GetCollection(GetCollectionRequest) returns (Collection);
  rpc ListUserCollections(ListUserCollectionsRequest) returns (ListUserCollectionsResponse);
  rpc ToggleLikeItem(ToggleLikeItemRequest) returns (ToggleLikeItemResponse);
  rpc AddCollectionItem(AddCollectionItemRequest) returns (CollectionItem);
  rpc RemoveCollectionItem(RemoveCollectionItemRequest) returns (CollectionItem);
  rpc ListCollectionItems(ListCollectionItemsRequest) returns (ListCollectionItemsResponse);

  // Unified Entity Social Status
  rpc GetEntitySocialSummary(GetEntitySocialSummaryRequest) returns (EntitySocialSummary);
}

// ---------------------------------------------------------
// Domain model
// ---------------------------------------------------------

message Answer {
  string uuid = 1;
  string question_uuid = 2;
  string user_uuid = 3;
  string body = 4; // Markdown
  int32 net_score = 5;
  bool is_accepted_by_asker = 6;
  bool is_author_endorsed = 7;
  bool is_edited = 8;
  optional google.protobuf.Timestamp deleted_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  optional google.protobuf.Timestamp accepted_at = 12;
  optional google.protobuf.Timestamp endorsed_at = 13;

  // Resolved display fields
  string author_username = 14;
  string author_avatar_url = 15;
  int32 upvote_count = 16;
  int32 downvote_count = 17;
  int32 current_user_vote = 18;
  int32 comment_count = 19;
  repeated AnswerComment comments = 20;
}

message Collection {
  string uuid = 1;
  string id = 2;
  string user_uuid = 3;
  string name = 4;
  string description = 5;
  bool is_system_collection = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;

  // Resolved display fields
  string author_username = 9;
  int32 item_count = 10;
  repeated string preview_images = 11;
  bool contains_item = 12;
}

message CollectionItem {
  string uuid = 1;
  string collection_uuid = 2;
  string entity_uuid = 3;
  google.protobuf.Timestamp created_at = 4;

  // Resolved item details for display
  string entity_id = 5;
  string collection = 6;
  string name = 7;
  optional string primary_display_image = 8;
  optional string author_or_manufacturer = 9;
}

message EntitySocialSummary {
  bool is_liked = 1;
  int32 like_count = 2;
  ReviewSummary review_summary = 3;
  int32 question_count = 4;
  bool is_archived = 5;
}

message Question {
  string uuid = 1;
  string id = 2;
  string user_uuid = 3;
  string entity_uuid = 4;
  string title = 5;
  string body = 6; // Markdown
  int32 net_score = 7;
  bool is_edited = 8;
  optional google.protobuf.Timestamp deleted_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;

  // Resolved display fields
  string author_username = 12;
  string author_avatar_url = 13;
  int32 upvote_count = 14;
  int32 downvote_count = 15;
  int32 answer_count = 16;
  bool has_accepted_answer = 17;
  int32 current_user_vote = 18;
  repeated QuestionComment comments = 19;
  string collection = 20;
  string entity_id = 21;
}

message Review {
  string uuid = 1;
  string id = 2;
  string user_uuid = 3;
  string entity_uuid = 4;
  bool is_recommended = 5; // true = Thumbs Up / Recommended, false = Thumbs Down
  string body = 6; // Markdown writeup
  bool is_edited = 7;
  optional google.protobuf.Timestamp deleted_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;

  // Denormalized / resolved fields for UI display
  string author_username = 11;
  string author_avatar_url = 12;
  int32 helpful_count = 13;
  int32 unhelpful_count = 14;
  int32 comment_count = 15;
  ReviewVoteType current_user_vote = 16;
  bool is_author_verified_owner = 17;
  string collection = 18;
  string entity_id = 19;
}

message ReviewComment {
  string uuid = 1;
  string review_uuid = 2;
  string user_uuid = 3;
  string body = 4;
  optional google.protobuf.Timestamp deleted_at = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;

  // Resolved display fields
  string author_username = 8;
  string author_avatar_url = 9;
}

message AnswerComment {
  string uuid = 1;
  string answer_uuid = 2;
  string user_uuid = 3;
  string body = 4;
  optional google.protobuf.Timestamp deleted_at = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;

  string author_username = 8;
  string author_avatar_url = 9;
}

message QuestionComment {
  string uuid = 1;
  string question_uuid = 2;
  string user_uuid = 3;
  string body = 4;
  optional google.protobuf.Timestamp deleted_at = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;

  string author_username = 8;
  string author_avatar_url = 9;
}

message ReviewSummary {
  int32 total_reviews = 1;
  int32 recommended_count = 2;
  float score_percentage = 3;
  ReviewTier tier = 4;
}

// ---------------------------------------------------------
// Request/response messages
// ---------------------------------------------------------

message AcceptAnswerRequest {
  string answer_uuid = 1;
}

message AddCollectionItemRequest {
  string collection_id = 1;
  string entity_id = 2;
  optional string collection = 3;
}

message CreateAnswerCommentRequest {
  string answer_uuid = 1;
  string body = 2;
}

message CreateAnswerRequest {
  string question_id = 1;
  string body = 2;
}

message CreateCollectionRequest {
  string name = 1;
  string description = 2;
}

message CreateQuestionCommentRequest {
  string question_id = 1;
  string body = 2;
}

message CreateQuestionRequest {
  string entity_id = 1;
  optional string collection = 2;
  string title = 3;
  string body = 4;
}

message CreateReviewCommentRequest {
  string review_id = 1;
  string body = 2;
}

message CreateReviewRequest {
  string entity_id = 1;
  optional string collection = 2;
  bool is_recommended = 3;
  string body = 4;
}

message DeleteAnswerCommentRequest {
  string comment_uuid = 1;
}

message DeleteAnswerRequest {
  string answer_uuid = 1;
}

message DeleteCollectionRequest {
  string collection_id = 1;
}

message DeleteQuestionCommentRequest {
  string comment_uuid = 1;
}

message DeleteQuestionRequest {
  string question_id = 1;
}

message DeleteReviewCommentRequest {
  string comment_uuid = 1;
}

message DeleteReviewRequest {
  string review_id = 1;
}

message EndorseAnswerRequest {
  string answer_uuid = 1;
}

message GetCollectionRequest {
  string id = 1; // Can be slug or UUID
}

message GetEntitySocialSummaryRequest {
  string entity_id = 1;
  optional string collection = 2;
}

message ListAnswersRequest {
  string question_id = 1;
}

message ListAnswersResponse {
  repeated Answer answers = 1;
}

message ListCollectionItemsRequest {
  string collection_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListCollectionItemsResponse {
  Collection collection = 1;
  repeated CollectionItem items = 2;
  string next_page_token = 3;
}

message ListQuestionsRequest {
  string entity_id = 1;
  optional string collection = 2;
  string sort_by = 3; // "score", "recent"
  string query = 4; // Search filter
  int32 page_size = 5;
  string page_token = 6;
}

message ListQuestionsResponse {
  repeated Question questions = 1;
  string next_page_token = 2;
}

message ListReviewCommentsRequest {
  string review_id = 1;
}

message ListReviewCommentsResponse {
  repeated ReviewComment comments = 1;
}

message ListReviewsRequest {
  string entity_id = 1;
  optional string collection = 2;
  string sort_by = 3; // "helpful", "recent", "positive", "negative"
  int32 page_size = 4;
  string page_token = 5;
}

message ListReviewsResponse {
  repeated Review reviews = 1;
  ReviewSummary summary = 2;
  string next_page_token = 3;
}

message ListUserCollectionsRequest {
  string user_id = 1; // Username or UUID
  optional string contains_entity_id = 2;
  optional string contains_collection = 3;
}

message ListUserCollectionsResponse {
  repeated Collection collections = 1;
}

message RemoveCollectionItemRequest {
  string collection_id = 1;
  string entity_id = 2;
  optional string collection = 3;
}

message ToggleLikeItemRequest {
  string entity_id = 1;
  optional string collection = 2;
}

message ToggleLikeItemResponse {
  bool is_liked = 1;
  int32 like_count = 2;
}

message UpdateAnswerRequest {
  string answer_uuid = 1;
  string body = 2;
}

message UpdateCollectionRequest {
  string collection_id = 1;
  string name = 2;
  string description = 3;
}

message UpdateQuestionRequest {
  string question_id = 1;
  string title = 2;
  string body = 3;
}

message UpdateReviewRequest {
  string review_id = 1;
  bool is_recommended = 2;
  string body = 3;
}

message VoteAnswerRequest {
  string answer_uuid = 1;
  int32 vote = 2; // +1, -1, or 0
}

message VoteAnswerResponse {
  int32 net_score = 1;
  int32 upvote_count = 2;
  int32 downvote_count = 3;
  int32 current_user_vote = 4;
}

message VoteQuestionRequest {
  string question_id = 1;
  int32 vote = 2; // +1, -1, or 0 to retract
}

message VoteQuestionResponse {
  int32 net_score = 1;
  int32 upvote_count = 2;
  int32 downvote_count = 3;
  int32 current_user_vote = 4;
}

message VoteReviewRequest {
  string review_id = 1;
  ReviewVoteType vote_type = 2; // HELPFUL, UNHELPFUL, or UNSPECIFIED to retract
}

message VoteReviewResponse {
  int32 helpful_count = 1;
  int32 unhelpful_count = 2;
  ReviewVoteType current_user_vote = 3;
}

// ---------------------------------------------------------
// Everything else
// ---------------------------------------------------------

enum ReviewTier {
  REVIEW_TIER_UNSPECIFIED = 0;
  REVIEW_TIER_OVERWHELMINGLY_POSITIVE = 1; // >= 95% (min 50 reviews)
  REVIEW_TIER_VERY_POSITIVE = 2; // 80% - 94% (min 10 reviews)
  REVIEW_TIER_POSITIVE = 3; // 70% - 79%
  REVIEW_TIER_MIXED = 4; // 40% - 69%
  REVIEW_TIER_MOSTLY_NEGATIVE = 5; // 20% - 39%
  REVIEW_TIER_OVERWHELMINGLY_NEGATIVE = 6; // < 20% (min 50 reviews)
  REVIEW_TIER_FEW_REVIEWS = 7; // < 5 reviews
}

enum ReviewVoteType {
  REVIEW_VOTE_TYPE_UNSPECIFIED = 0;
  REVIEW_VOTE_TYPE_HELPFUL = 1;
  REVIEW_VOTE_TYPE_UNHELPFUL = 2;
}
