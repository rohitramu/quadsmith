syntax = "proto3";

package quadsmith.api;

import "quadsmith/api/media.proto";
import "quadsmith/api/reference_link.proto";
import "quadsmith/common/common.proto";
import "quadsmith/data/data.proto";
import "quadsmith/sql/sql.proto";

option go_package = "quadsmith/shared/gen/quadsmith/api;api";

// ---------------------------------------------------------
// Services
// ---------------------------------------------------------

service GpsReceiverService {
  rpc GetGpsReceiver(GetGpsReceiverRequest) returns (GpsReceiver);
  rpc ListGpsReceivers(ListGpsReceiversRequest) returns (ListGpsReceiversResponse);
}

// ---------------------------------------------------------
// Domain model
// ---------------------------------------------------------

message GpsReceiver {
  option (quadsmith.sql.table) = {
    name: "gps_receivers"
    inherits: "entities"
  };
  option (quadsmith.common.collection_path) = "components/hardware/gps-receivers";
  option (quadsmith.data.export) = {domain: EXPORT_DOMAIN_NONE};
  option (quadsmith.common.frontend) = {
    default_columns: [
      "manufacturer",
      "name",
      "chipset",
      "compass"
    ]
  };

  string uuid = 1 [
    (quadsmith.sql.column) = {
      is_primary_key: true
      references: "entities(uuid) ON DELETE CASCADE"
    },
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];

  string id = 2 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];

  string manufacturer = 3 [
    (quadsmith.sql.column) = {create_index: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];
  string name = 4 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  bool is_internal_only = 5 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];

  float weight_g = 6 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];

  // GNSS chipset (e.g., "u-blox MAX-M10S", "u-blox M10", "M10050")
  string chipset = 7 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];

  // Primary communication protocol (e.g., "UBLOX", "NMEA")
  string protocol = 8 [
    (quadsmith.sql.column) = {create_index: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];

  // Integrated magnetic compass chip model (e.g., "QMC5883L", "IST8310")
  optional string compass = 9 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];

  // Minimum operating input voltage
  float input_voltage_min_v = 11 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];

  // Maximum operating input voltage
  float input_voltage_max_v = 12 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];

  string description = 13 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  repeated ReferenceLink reference_links = 14 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  optional string primary_display_image = 15 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  repeated Media media = 16 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  bool is_archived = 17 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
}

// ---------------------------------------------------------
// Request/response messages
// ---------------------------------------------------------

message GetGpsReceiverRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListGpsReceiversRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListGpsReceiversResponse {
  repeated GpsReceiver gps_receivers = 1;
  string next_page_token = 2;
}
