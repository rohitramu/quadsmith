syntax = "proto3";

package quadsmith.api;

import "quadsmith/api/media.proto";
import "quadsmith/api/reference_link.proto";
import "quadsmith/common/common.proto";
import "quadsmith/data/data.proto";
import "quadsmith/sql/sql.proto";

option go_package = "quadsmith/shared/gen/quadsmith/api;api";

// ---------------------------------------------------------
// Services
// ---------------------------------------------------------

service FieldToolService {
  rpc GetFieldTool(GetFieldToolRequest) returns (FieldTool);
  rpc ListFieldTools(ListFieldToolsRequest) returns (ListFieldToolsResponse);
}

// ---------------------------------------------------------
// Domain model
// ---------------------------------------------------------

message FieldTool {
  option (quadsmith.sql.table) = {
    name: "field_tools"
    inherits: "entities"
  };
  option (quadsmith.common.collection_path) = "components/gear/field-tools";
  option (quadsmith.data.export) = {domain: EXPORT_DOMAIN_NONE};
  option (quadsmith.common.frontend) = {
    default_columns: [
      "manufacturer",
      "name",
      "tool_type",
      "power_source",
      "weight_g"
    ]
  };

  string uuid = 1 [
    (quadsmith.sql.column) = {
      is_primary_key: true
      references: "entities(uuid) ON DELETE CASCADE"
    },
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];
  string id = 2 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  string manufacturer = 3 [
    (quadsmith.sql.column) = {create_index: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];
  string name = 4 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  float weight_g = 5 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  string tool_type = 6 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  string power_source = 7 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  string description = 8 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  repeated ReferenceLink reference_links = 9 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  optional string primary_display_image = 10 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  repeated Media media = 11 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  bool is_archived = 12 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
}

// ---------------------------------------------------------
// Request/response messages
// ---------------------------------------------------------

message GetFieldToolRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListFieldToolsRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListFieldToolsResponse {
  repeated FieldTool field_tools = 1;
  string next_page_token = 2;
}
