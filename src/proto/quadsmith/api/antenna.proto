syntax = "proto3";

package quadsmith.api;

import "quadsmith/api/media.proto";
import "quadsmith/api/reference_link.proto";
import "quadsmith/common/common.proto";
import "quadsmith/data/data.proto";
import "quadsmith/sql/sql.proto";

option go_package = "quadsmith/shared/gen/quadsmith/api;api";

// ---------------------------------------------------------
// Services
// ---------------------------------------------------------

service AntennaService {
  rpc GetAntenna(GetAntennaRequest) returns (Antenna);
  rpc ListAntennas(ListAntennasRequest) returns (ListAntennasResponse);
  rpc CreateAntenna(CreateAntennaRequest) returns (Antenna);
  rpc UpdateAntenna(UpdateAntennaRequest) returns (Antenna);
  rpc DeleteAntenna(DeleteAntennaRequest) returns (DeleteAntennaResponse);
}

// ---------------------------------------------------------
// Domain model
// ---------------------------------------------------------

message Antenna {
  option (quadsmith.sql.table) = {
    name: "antennas"
    inherits: "entities"
  };
  option (quadsmith.common.collection_path) = "components/hardware/antennas";
  option (quadsmith.data.export) = {
    domain: EXPORT_DOMAIN_COMPONENTS
    user_filter: "uuid IN (SELECT uuid FROM entities WHERE collection = 'antennas' AND user_uuid = $1::uuid)"
  };
  option (quadsmith.common.frontend) = {
    default_columns: [
      "manufacturer",
      "name",
      "connector",
      "polarization",
      "frequency_band_mhz",
      "gain_dbi"
    ]
  };

  string uuid = 1 [
    (quadsmith.sql.column) = {
      is_primary_key: true
      references: "entities(uuid) ON DELETE CASCADE"
    },
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];

  string id = 2 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];

  string manufacturer = 3 [
    (quadsmith.sql.column) = {create_index: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  string name = 4 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  bool is_internal_only = 5 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];

  float weight_g = 6 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];

  // E.g., "U.FL", "MMCX", "SMA", "RP-SMA"
  string connector = 7 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];

  // E.g., "RHCP", "LHCP", "Linear"
  string polarization = 8 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];

  // Center frequency in GHz (e.g., 5.8, 2.4, 0.9)
  uint32 frequency_band_mhz = 9 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];

  // Length in millimeters (e.g., 60, 100, 150)
  float length_mm = 10 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];

  // Gain in dBi (e.g., 2.5, 3.0)
  float gain_dbi = 11 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string description = 12 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  repeated ReferenceLink reference_links = 13 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  optional string primary_display_image = 14 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  repeated Media media = 15 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  optional string user_uuid = 16 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  optional string author_username = 17 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
}

// ---------------------------------------------------------
// Request/response messages
// ---------------------------------------------------------

message CreateAntennaRequest {
  Antenna antenna = 1;
}

message DeleteAntennaRequest {
  string id = 1;
}

message DeleteAntennaResponse {
  bool is_archived = 1;
}

message GetAntennaRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListAntennasRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListAntennasResponse {
  repeated Antenna antennas = 1;
  string next_page_token = 2;
}

message UpdateAntennaRequest {
  Antenna antenna = 1;
}
