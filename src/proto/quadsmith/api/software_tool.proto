syntax = "proto3";

package quadsmith.api;

import "quadsmith/api/media.proto";
import "quadsmith/api/reference_link.proto";
import "quadsmith/common/common.proto";
import "quadsmith/data/data.proto";
import "quadsmith/sql/sql.proto";

option go_package = "quadsmith/shared/gen/quadsmith/api;api";

// ---------------------------------------------------------
// Services
// ---------------------------------------------------------

service SoftwareToolService {
  rpc GetSoftwareTool(GetSoftwareToolRequest) returns (SoftwareTool);
  rpc ListSoftwareTools(ListSoftwareToolsRequest) returns (ListSoftwareToolsResponse);
  rpc CreateSoftwareTool(CreateSoftwareToolRequest) returns (SoftwareTool);
  rpc UpdateSoftwareTool(UpdateSoftwareToolRequest) returns (SoftwareTool);
  rpc DeleteSoftwareTool(DeleteSoftwareToolRequest) returns (DeleteSoftwareToolResponse);
}

// ---------------------------------------------------------
// Domain model
// ---------------------------------------------------------

message SoftwareTool {
  option (quadsmith.sql.table) = {
    name: "software_tools"
    inherits: "entities"
  };
  option (quadsmith.common.collection_path) = "components/software/software-tools";
  option (quadsmith.data.export) = {
    domain: EXPORT_DOMAIN_COMPONENTS
    user_filter: "uuid IN (SELECT uuid FROM entities WHERE collection = 'software-tools' AND user_uuid = $1::uuid)"
  };
  option (quadsmith.common.frontend) = {
    default_columns: [
      "manufacturer",
      "name",
      "version",
      "category",
      "platform"
    ]
  };

  string uuid = 1 [
    (quadsmith.sql.column) = {
      is_primary_key: true
      references: "entities(uuid) ON DELETE CASCADE"
    },
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];
  string id = 2 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  string manufacturer = 3 [
    (quadsmith.sql.column) = {create_index: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  string name = 4 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string version = 5 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string category = 6 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string platform = 7 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string description = 8 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  repeated ReferenceLink reference_links = 9 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  optional string primary_display_image = 10 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  repeated Media media = 11 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  optional string user_uuid = 12 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  optional string author_username = 13 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
}

// ---------------------------------------------------------
// Request/response messages
// ---------------------------------------------------------

message CreateSoftwareToolRequest {
  SoftwareTool software_tool = 1;
}

message DeleteSoftwareToolRequest {
  string id = 1;
}

message DeleteSoftwareToolResponse {
  bool is_archived = 1;
}

message GetSoftwareToolRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListSoftwareToolsRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListSoftwareToolsResponse {
  repeated SoftwareTool software_tools = 1;
  string next_page_token = 2;
}

message UpdateSoftwareToolRequest {
  SoftwareTool software_tool = 1;
}
