syntax = "proto3";

package quadsmith.api;

import "quadsmith/api/media.proto";
import "quadsmith/api/reference_link.proto";
import "quadsmith/common/common.proto";
import "quadsmith/data/data.proto";
import "quadsmith/sql/sql.proto";

option go_package = "quadsmith/shared/gen/quadsmith/api;api";

// ---------------------------------------------------------
// Services
// ---------------------------------------------------------

service FcFirmwareService {
  rpc GetFcFirmware(GetFcFirmwareRequest) returns (FcFirmware);
  rpc ListFcFirmwares(ListFcFirmwaresRequest) returns (ListFcFirmwaresResponse);
  rpc CreateFcFirmware(CreateFcFirmwareRequest) returns (FcFirmware);
  rpc UpdateFcFirmware(UpdateFcFirmwareRequest) returns (FcFirmware);
  rpc DeleteFcFirmware(DeleteFcFirmwareRequest) returns (DeleteFcFirmwareResponse);
}

// ---------------------------------------------------------
// Domain model
// ---------------------------------------------------------

message FcFirmware {
  option (quadsmith.sql.table) = {
    name: "flight_controller_firmwares"
    inherits: "entities"
  };
  option (quadsmith.common.collection_path) = "components/software/fc-firmware";
  option (quadsmith.data.export) = {
    domain: EXPORT_DOMAIN_COMPONENTS
    user_filter: "uuid IN (SELECT uuid FROM entities WHERE collection = 'fc-firmware' AND user_uuid = $1::uuid)"
  };
  option (quadsmith.common.frontend) = {
    default_columns: [
      "manufacturer",
      "name",
      "version",
      "target_architectures",
      "is_open_source"
    ]
  };

  string uuid = 1 [
    (quadsmith.sql.column) = {
      is_primary_key: true
      references: "entities(uuid) ON DELETE CASCADE"
    },
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];
  string id = 2 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  string manufacturer = 3 [
    (quadsmith.sql.column) = {create_index: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  string name = 4 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string version = 5 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string target_architectures = 6 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string supported_protocols = 7 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  bool is_open_source = 8 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string repository_url = 9 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string description = 10 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  repeated ReferenceLink reference_links = 11 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  optional string primary_display_image = 12 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  repeated Media media = 13 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  optional string user_uuid = 14 [(quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC];
  optional string author_username = 15 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
}

// ---------------------------------------------------------
// Request/response messages
// ---------------------------------------------------------

message CreateFcFirmwareRequest {
  FcFirmware fc_firmware = 1;
}

message DeleteFcFirmwareRequest {
  string id = 1;
}

message DeleteFcFirmwareResponse {
  bool is_archived = 1;
}

message GetFcFirmwareRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListFcFirmwaresRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListFcFirmwaresResponse {
  repeated FcFirmware fc_firmwares = 1;
  string next_page_token = 2;
}

message UpdateFcFirmwareRequest {
  FcFirmware fc_firmware = 1;
}
