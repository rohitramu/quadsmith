syntax = "proto3";

package quadsmith.api;

import "quadsmith/api/media.proto";
import "quadsmith/api/reference_link.proto";
import "quadsmith/common/common.proto";
import "quadsmith/data/data.proto";
import "quadsmith/sql/sql.proto";

option go_package = "quadsmith/shared/gen/quadsmith/api;api";

// ---------------------------------------------------------
// 1. gRPC Service (Services First)
// ---------------------------------------------------------
service GogglesService {
  rpc GetGoggles(GetGogglesRequest) returns (Goggles);
  rpc ListGoggles(ListGogglesRequest) returns (ListGogglesResponse);
  rpc CreateGoggles(CreateGogglesRequest) returns (Goggles);
  rpc UpdateGoggles(UpdateGogglesRequest) returns (Goggles);
  rpc DeleteGoggles(DeleteGogglesRequest) returns (DeleteGogglesResponse);
}

// ---------------------------------------------------------
// 2. RPC Requests & Responses (Callers Precede Callees)
// ---------------------------------------------------------
message CreateGogglesRequest {
  Goggles goggles = 1;
}

message DeleteGogglesRequest {
  string id = 1;
}

message DeleteGogglesResponse {
  bool is_archived = 1;
}

message GetGogglesRequest {
  string id = 1;
  repeated string columns = 2;
}

message ListGogglesRequest {
  string filter = 1;
  int32 page_size = 2;
  string page_token = 3;
  repeated string columns = 4;
  repeated string sort = 5;
}

message ListGogglesResponse {
  repeated Goggles goggles = 1;
  string next_page_token = 2;
}

message UpdateGogglesRequest {
  Goggles goggles = 1;
}

// ---------------------------------------------------------
// 3. Domain Model (Referenced by Services and Requests above)
// ---------------------------------------------------------
message Goggles {
  option (quadsmith.sql.table) = {name: "goggles"};
  option (quadsmith.common.collection_path) = "components/gear/goggles";
  option (quadsmith.data.export) = {
    domain: EXPORT_DOMAIN_COMPONENTS
    user_filter: "uuid IN (SELECT uuid FROM entities WHERE collection = 'goggles' AND user_uuid = $1::uuid)"
  };
  option (quadsmith.common.frontend) = {
    color_code: "#d946ef"
    default_columns: [
      "manufacturer",
      "name",
      "video_protocol",
      "display_type",
      "resolution",
      "fov_deg"
    ]
  };

  string uuid = 1 [
    (quadsmith.sql.column) = {
      is_primary_key: true
      references: "entities(uuid) ON DELETE CASCADE"
    },
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];
  string id = 2 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];
  string manufacturer = 3 [
    (quadsmith.sql.column) = {create_index: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  string name = 4 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  float weight_g = 5 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string video_protocol = 6 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string display_type = 7 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string resolution = 8 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  float fov_deg = 9 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string ipd_range_mm = 10 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string voltage_range = 11 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  bool dvr_supported = 12 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  string description = 13 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  repeated ReferenceLink reference_links = 14 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  optional string primary_display_image = 15 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  repeated Media media = 16 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
  optional string user_uuid = 17 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];
  optional string author_username = 18 [
    (quadsmith.sql.column) = {ignore: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC
  ];
}
