syntax = "proto3";

package quadsmith.sql;

import "google/protobuf/descriptor.proto";

option go_package = "quadsmith/shared/gen/quadsmith/sql;sql";

// ---------------------------------------------------------
// Domain model
// ---------------------------------------------------------

message TableOptions {
  // The name of the SQL table to generate for this message.
  // If omitted, the Go generator will not generate a table for this message.
  // Example: option (quadsmith.sql.table) = { name: "motors" };
  string name = 1;

  // Table-level CHECK constraints.
  // Example: checks: "num_nonnulls(build_uuid, component_uuid) = 1"
  repeated string checks = 2;

  // Composite UNIQUE constraints.
  // Example: unique_constraints: "user_uuid, build_uuid"
  repeated string unique_constraints = 3;

  // Partial or expression UNIQUE indexes.
  repeated UniqueIndex unique_indexes = 4;
}

message UniqueIndex {
  string name = 1;
  string columns = 2;
  string where = 3;
}

message ColumnOptions {
  // The name of the SQL column to generate for this field.
  // If omitted, the Go generator will use the field name as the column name.
  string name = 1;

  // Marks this field as the PRIMARY KEY of the generated table.
  bool is_primary_key = 2;

  // Defines a FOREIGN KEY constraint.
  // The value should be formatted as "target_table(target_column)".
  // Example: [(quadsmith.sql.column) = { references: "frames(uuid)" }]
  string references = 3;

  // Adds a UNIQUE constraint to the generated column.
  bool is_unique = 4;

  // Generates a standard B-Tree index for this column to speed up CEL queries.
  bool create_index = 5;

  // Custom SQL column type override.
  string column_type = 6;

  // Default value expression for the column (e.g., "4", "'pending'", "NOW()").
  string default_value = 7;

  // If true, this field is an API-only field and will not be generated in the SQL schema or store operations.
  bool ignore = 8;
}

// ---------------------------------------------------------
// Everything else
// ---------------------------------------------------------

extend google.protobuf.MessageOptions {
  // SQL table configuration for backend database mapping.
  TableOptions table = 51000;
}

extend google.protobuf.FieldOptions {
  // SQL column configuration for backend database mapping.
  ColumnOptions column = 51000;
}
