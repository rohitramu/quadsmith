message Answer {
  option (quadsmith.sql.table) = {name: "answers"};
  option (quadsmith.data.export) = {domain: EXPORT_DOMAIN_SOCIAL};

  string uuid = 1 [
    (quadsmith.sql.column) = {is_primary_key: true},
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];
  string question_uuid = 2 [
    (quadsmith.sql.column) = {
      references: "questions(uuid) ON DELETE CASCADE"
      create_index: true
    },
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];
  string user_uuid = 3 [
    (quadsmith.sql.column) = {
      references: "users(uuid)"
      create_index: true
    },
    (quadsmith.data.content_type) = CONTENT_TYPE_SYSTEM_METADATA_PUBLIC
  ];
  string body = 4 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_PROVIDED_PUBLIC];
  int32 net_score = 5 [
    (quadsmith.sql.column) = {
      default_value: "0"
      create_index: true
    },
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_OBSERVED
  ];
  bool is_accepted_by_asker = 6 [
    (quadsmith.sql.column) = {default_value: "false"},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_OBSERVED
  ];
  bool is_author_endorsed = 7 [
    (quadsmith.sql.column) = {default_value: "false"},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_OBSERVED
  ];
  bool is_edited = 8 [
    (quadsmith.sql.column) = {default_value: "false"},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_OBSERVED
  ];
  optional google.protobuf.Timestamp deleted_at = 9 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_OBSERVED];
  google.protobuf.Timestamp created_at = 10 [
    (quadsmith.sql.column) = {default_value: "NOW()"},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_OBSERVED
  ];
  google.protobuf.Timestamp updated_at = 11 [
    (quadsmith.sql.column) = {default_value: "NOW()"},
    (quadsmith.data.content_type) = CONTENT_TYPE_USER_OBSERVED
  ];
  optional google.protobuf.Timestamp accepted_at = 12 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_OBSERVED];
  optional google.protobuf.Timestamp endorsed_at = 13 [(quadsmith.data.content_type) = CONTENT_TYPE_USER_OBSERVED];
}

