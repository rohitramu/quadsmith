    domain: EXPORT_DOMAIN_COLLECTIONS
    user_filter: "collection_uuid IN (SELECT uuid FROM collections WHERE user_uuid = $1::uuid)"
  };

  string uuid = 1 [
    (quadsmith.sql.column) = {is_primary_key: true},
