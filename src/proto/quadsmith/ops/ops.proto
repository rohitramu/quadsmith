syntax = "proto3";

package quadsmith.ops;

import "google/protobuf/timestamp.proto";

option go_package = "quadsmith/shared/gen/quadsmith/ops;ops";

// ---------------------------------------------------------
// Services
// ---------------------------------------------------------

service OpsService {
  // System Health, Metrics & Diagnostics
  rpc GetSystemDiagnostics(GetSystemDiagnosticsRequest) returns (GetSystemDiagnosticsResponse);
  rpc GetSystemHealth(GetSystemHealthRequest) returns (GetSystemHealthResponse);
  rpc GetSystemMetrics(GetSystemMetricsRequest) returns (GetSystemMetricsResponse);
  rpc GetTrace(GetTraceRequest) returns (GetTraceResponse);
  rpc ListRouteRequests(ListRouteRequestsRequest) returns (ListRouteRequestsResponse);

  // Database Stats (Public DB quadsmith_api)
  rpc GetDatabaseStats(GetDatabaseStatsRequest) returns (GetDatabaseStatsResponse);

  // Maintenance & Cleanup Tasks
  rpc CleanupExpiredOtps(CleanupExpiredOtpsRequest) returns (CleanupExpiredOtpsResponse);
  rpc CleanupExpiredTokens(CleanupExpiredTokensRequest) returns (CleanupExpiredTokensResponse);
  rpc CleanupOrphanedBlobs(CleanupOrphanedBlobsRequest) returns (CleanupOrphanedBlobsResponse);
  rpc PurgeSoftDeletedAccounts(PurgeSoftDeletedAccountsRequest) returns (PurgeSoftDeletedAccountsResponse);
  rpc SendUsernameReleaseWarnings(SendUsernameReleaseWarningsRequest) returns (SendUsernameReleaseWarningsResponse);
  rpc SetUserRole(SetUserRoleRequest) returns (SetUserRoleResponse);

  // Tasks, Jobs & Audit
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc ListInternalApiCalls(ListInternalApiCallsRequest) returns (ListInternalApiCallsResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);

  // Authentication & IAM
  rpc ExchangeOAuthCode(ExchangeOAuthCodeRequest) returns (ExchangeOAuthCodeResponse);
  rpc GetCurrentOperator(GetCurrentOperatorRequest) returns (GetCurrentOperatorResponse);
  rpc GetOAuthConfig(GetOAuthConfigRequest) returns (GetOAuthConfigResponse);
  rpc ListIamUsers(ListIamUsersRequest) returns (ListIamUsersResponse);
  rpc ListIamGroups(ListIamGroupsRequest) returns (ListIamGroupsResponse);

  // Dynamic Token Management
  rpc CreateInternalToken(CreateInternalTokenRequest) returns (CreateInternalTokenResponse);
  rpc ListInternalTokens(ListInternalTokensRequest) returns (ListInternalTokensResponse);
  rpc RevokeInternalToken(RevokeInternalTokenRequest) returns (RevokeInternalTokenResponse);

  // JIT Elevation
  rpc AcquireJitGrant(AcquireJitGrantRequest) returns (AcquireJitGrantResponse);
  rpc ExtendJitGrant(ExtendJitGrantRequest) returns (ExtendJitGrantResponse);
  rpc ListJitGrants(ListJitGrantsRequest) returns (ListJitGrantsResponse);
  rpc RevokeJitGrant(RevokeJitGrantRequest) returns (RevokeJitGrantResponse);
}

// ---------------------------------------------------------
// Domain model
// ---------------------------------------------------------

message InternalApiCallRecord {
  string uuid = 1;
  string id = 2;
  string method = 3;
  string caller = 4;
  string caller_type = 5;
  string group_name = 6;
  optional string jit_grant_uuid = 7;
  optional string jit_grant_id = 8;
  string status = 9;
  optional string error_message = 10;
  int64 duration_ms = 11;
  google.protobuf.Timestamp created_at = 12;
  string region = 13;
  string trace_id = 14;
}

message InternalTokenRecord {
  string uuid = 1;
  string id = 2;
  string name = 3;
  string type = 4; // 'HUMAN' or 'ROBOT'
  string group_name = 5;
  string token_hash = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp revoked_at = 9;
}

message JitGrantRecord {
  string uuid = 1;
  string id = 2;
  string token_hash = 3;
  string operator = 4;
  string operator_type = 5; // 'HUMAN' or 'ROBOT'
  string reason = 6;
  string operation = 7;
  string status = 8;
  int32 hours = 9;
  google.protobuf.Timestamp expires_at = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp extended_at = 12;
  google.protobuf.Timestamp revoked_at = 13;
}

message JobRecord {
  string uuid = 1;
  string job_id = 2;
  string task_name = 3;
  string procedure = 4;
  string caller = 5;
  string caller_type = 6;
  string status = 7;
  int64 duration_ms = 8;
  optional string error_message = 9;
  google.protobuf.Timestamp created_at = 10;
  string region = 11;
  string trace_id = 12;
}

message TaskDef {
  string name = 1;
  string procedure = 2;
  string description = 3;
  string default_interval = 4;
}

// ---------------------------------------------------------
// Request/response messages
// ---------------------------------------------------------

message AcquireJitGrantRequest {
  int32 hours = 1; // 1 to 12
  string reason = 2;
  string operation = 3; // optional, defaults to '*'
}

message AcquireJitGrantResponse {
  JitGrantRecord grant = 1;
}

message CleanupExpiredOtpsRequest {}

message CleanupExpiredOtpsResponse {
  int64 cleaned_count = 1;
}

message CleanupExpiredTokensRequest {}

message CleanupExpiredTokensResponse {
  int64 cleaned_count = 1;
}

message CleanupOrphanedBlobsRequest {}

message CleanupOrphanedBlobsResponse {
  int64 cleaned_count = 1;
}

message CreateInternalTokenRequest {
  string name = 1;
  string type = 2; // 'HUMAN' or 'ROBOT'
  string group_name = 3;
  int32 duration_days = 4;
}

message CreateInternalTokenResponse {
  string token_id = 1;
  string token_secret = 2;
  InternalTokenRecord record = 3;
}

message ExchangeOAuthCodeRequest {
  string code = 1;
  string code_verifier = 2;
  string redirect_uri = 3;
}

message ExchangeOAuthCodeResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  string operator = 3;
  string group_name = 4;
}

message ExtendJitGrantRequest {
  string grant_id = 1;
  int32 hours = 2; // 1 to 12
}

message ExtendJitGrantResponse {
  JitGrantRecord grant = 1;
}

message GetCurrentOperatorRequest {}

message GetCurrentOperatorResponse {
  string operator = 1;
  string operator_type = 2; // 'HUMAN' or 'ROBOT'
  string group_name = 3;
  google.protobuf.Timestamp session_expires_at = 4;
  optional JitGrantRecord active_jit_grant = 5;
}

message GetDatabaseStatsRequest {
  optional string filter = 1;
  repeated string sort = 2;
}

message GetDatabaseStatsResponse {
  string database_name = 1;
  int64 total_size_bytes = 2;
  repeated TableStat tables = 3;
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  JobRecord job = 1;
}

message GetOAuthConfigRequest {}

message GetOAuthConfigResponse {
  string provider = 1;
  string client_id = 2;
  string environment = 3;
  string region = 4;
  string authorize_url = 5;
}

message GetSystemDiagnosticsRequest {}

message GetSystemDiagnosticsResponse {
  string version = 1;
  string environment = 2;
  int64 uptime_seconds = 3;
  int64 memory_allocated_bytes = 4;
  int32 num_goroutines = 5;
  int32 active_database_connections = 6;
  int32 active_internal_connections = 7;
}

message GetSystemHealthRequest {
  optional string region_filter = 1;
}

message GetSystemHealthResponse {
  string status = 1;
  string environment = 2;
  string region = 3;
  google.protobuf.Timestamp checked_at = 4;
  repeated ServiceHealthStatus services = 5;
}

message GetSystemMetricsRequest {
  optional string region_filter = 1;
  optional string service_filter = 2;
  optional string window = 3;
  optional string filter = 4;
  repeated string sort = 5;
}

message GetSystemMetricsResponse {
  string environment = 1;
  string region = 2;
  string window = 3;
  google.protobuf.Timestamp generated_at = 4;
  repeated ServiceMetricsSummary services = 5;
}

message GetTaskRequest {
  string task_name = 1;
}

message GetTaskResponse {
  TaskDef task = 1;
}

message GetTraceRequest {
  string trace_id = 1;
}

message GetTraceResponse {
  string trace_id = 1;
  string region = 2;
  string root_service = 3;
  string root_route = 4;
  string root_method = 5;
  int32 status_code = 6;
  bool success = 7;
  double total_rtt_ms = 8;
  google.protobuf.Timestamp started_at = 9;
  repeated TraceSpan spans = 10;
  repeated TraceLogRecord logs = 11;
}

message ListIamGroupsRequest {
  optional string filter = 1;
  repeated string sort = 2;
}

message ListIamGroupsResponse {
  repeated IamGroupSummary groups = 1;
}

message ListIamUsersRequest {
  optional string filter = 1;
  repeated string sort = 2;
}

message ListIamUsersResponse {
  repeated IamUserSummary users = 1;
}

message ListInternalApiCallsRequest {
  int32 limit = 1;
  string caller_filter = 2;
  string method_filter = 3;
  optional string filter = 4;
  repeated string sort = 5;
}

message ListInternalApiCallsResponse {
  repeated InternalApiCallRecord calls = 1;
}

message ListInternalTokensRequest {
  optional string filter = 1;
  repeated string sort = 2;
}

message ListInternalTokensResponse {
  repeated InternalTokenRecord tokens = 1;
}

message ListJitGrantsRequest {
  bool active_only = 1;
  optional string filter = 2;
  repeated string sort = 3;
}

message ListJitGrantsResponse {
  repeated JitGrantRecord grants = 1;
}

message ListJobsRequest {
  optional int32 limit = 1;
  optional string task_name = 2;
  optional string filter = 3;
  repeated string sort = 4;
}

message ListJobsResponse {
  repeated JobRecord jobs = 1;
}

message ListRouteRequestsRequest {
  optional string region_filter = 1;
  optional string service_name = 2;
  optional string route = 3;
  optional string window = 4;
  optional bool only_errors = 5;
  optional int32 limit = 6;
  optional string filter = 7;
  repeated string sort = 8;
}

message ListRouteRequestsResponse {
  repeated RouteRequestLog requests = 1;
}

message ListTasksRequest {
  optional string filter = 1;
  repeated string sort = 2;
}

message ListTasksResponse {
  repeated TaskDef tasks = 1;
}

message PurgeSoftDeletedAccountsRequest {}

message PurgeSoftDeletedAccountsResponse {
  int64 purged_count = 1;
}

message RevokeInternalTokenRequest {
  string id = 1;
}

message RevokeInternalTokenResponse {
  bool success = 1;
}

message RevokeJitGrantRequest {
  string grant_id = 1;
}

message RevokeJitGrantResponse {
  bool success = 1;
}

message SendUsernameReleaseWarningsRequest {}

message SendUsernameReleaseWarningsResponse {
  int64 warning_count = 1;
}

message SetUserRoleRequest {
  string user_id = 1; // Username (id) or UUID
  string role = 2; // Target role: "USER" or "ADMIN"
}

message SetUserRoleResponse {
  string user_uuid = 1;
  string username = 2;
  string previous_role = 3;
  string role = 4;
}

// ---------------------------------------------------------
// Everything else
// ---------------------------------------------------------

message IamGroupSummary {
  string name = 1;
  string description = 2;
  repeated string allowed_methods = 3;
}

message IamUserSummary {
  string operator = 1;
  string type = 2;
  string group_name = 3;
  google.protobuf.Timestamp last_active_at = 4;
  bool has_active_jit = 5;
}

message RouteRequestLog {
  string trace_id = 1;
  string region = 2;
  string service_name = 3;
  string instance_id = 4;
  string route = 5;
  string method = 6;
  int32 status_code = 7;
  bool success = 8;
  double rtt_ms = 9;
  google.protobuf.Timestamp occurred_at = 10;
}

message ServiceHealthStatus {
  string service_name = 1;
  string region = 2;
  string instance_id = 3;
  string status = 4;
  string version = 5;
  int64 uptime_seconds = 6;
  int64 memory_allocated_bytes = 7;
  int32 num_goroutines = 8;
  int32 db_acquired_conns = 9;
  int32 db_idle_conns = 10;
  int32 db_max_conns = 11;
  repeated DependencyCheckResult checks = 12;
}

message ServiceMetricsSummary {
  string service_name = 1;
  string region = 2;
  int64 total_requests = 3;
  int64 success_count = 4;
  int64 error_count = 5;
  double availability_percent = 6;
  double p50_rtt_ms = 7;
  double p95_rtt_ms = 8;
  double p99_rtt_ms = 9;
  repeated RouteMetricStat routes = 10;
}

message TableStat {
  string table_name = 1;
  int64 row_count = 2;
  int64 total_size_bytes = 3;
}

message TraceLogRecord {
  google.protobuf.Timestamp timestamp = 1;
  string level = 2;
  string service_name = 3;
  string instance_id = 4;
  string region = 5;
  string message = 6;
  map<string, string> attributes = 7;
}

message TraceSpan {
  string span_id = 1;
  string service_name = 2;
  string instance_id = 3;
  string region = 4;
  string operation = 5;
  string method = 6;
  int32 status_code = 7;
  bool success = 8;
  double duration_ms = 9;
  google.protobuf.Timestamp occurred_at = 10;
  map<string, string> attributes = 11;
}

message DependencyCheckResult {
  string name = 1;
  string status = 2;
  double latency_ms = 3;
  optional string message = 4;
}

message RouteMetricStat {
  string route = 1;
  string method = 2;
  string region = 3;
  string service_name = 4;
  int64 total_requests = 5;
  int64 success_count = 6;
  int64 error_count = 7;
  double availability_percent = 8;
  double p50_rtt_ms = 9;
  double p95_rtt_ms = 10;
  double p99_rtt_ms = 11;
}
