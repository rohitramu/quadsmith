syntax = "proto3";

package quadsmith.config;

import "google/protobuf/duration.proto";
import "quadsmith/config/common.proto";

option go_package = "quadsmith/shared/gen/quadsmith/config;config";

// ---------------------------------------------------------
// Domain model
// ---------------------------------------------------------

message JobServerConfig {
  optional string environment = 1;
  ServerConfig server = 2;
  optional string ops_server_url = 3;
  optional string auth_token = 4;
  DatabaseConfig internal_database = 5;

  optional CleanupExpiredOtpsSchedule cleanup_expired_otps = 6;
  optional CleanupExpiredTokensSchedule cleanup_expired_tokens = 7;
  optional CleanupOrphanedBlobsSchedule cleanup_orphaned_blobs = 8;
  optional DatabaseMaintenanceSchedule database_maintenance = 9;
  optional PurgeSoftDeletedAccountsSchedule purge_soft_deleted_accounts = 10;
  optional SendUsernameReleaseWarningsSchedule send_username_release_warnings = 11;
}

message CleanupExpiredOtpsSchedule {
  optional bool enabled = 1;
  oneof schedule {
    string cron = 2;
    google.protobuf.Duration interval = 3;
  }
}

message CleanupExpiredTokensSchedule {
  optional bool enabled = 1;
  oneof schedule {
    string cron = 2;
    google.protobuf.Duration interval = 3;
  }
}

message CleanupOrphanedBlobsSchedule {
  optional bool enabled = 1;
  oneof schedule {
    string cron = 2;
    google.protobuf.Duration interval = 3;
  }
}

message DatabaseMaintenanceSchedule {
  optional bool enabled = 1;
  oneof schedule {
    string cron = 2;
    google.protobuf.Duration interval = 3;
  }
  optional bool full_vacuum = 4;
}

message PurgeSoftDeletedAccountsSchedule {
  optional bool enabled = 1;
  oneof schedule {
    string cron = 2;
    google.protobuf.Duration interval = 3;
  }
}

message SendUsernameReleaseWarningsSchedule {
  optional bool enabled = 1;
  oneof schedule {
    string cron = 2;
    google.protobuf.Duration interval = 3;
  }
}
